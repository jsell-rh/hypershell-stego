kind: service
name: hypershell-console
archetype: browser-service
language: go
overrides:
  postgres-adapter:
    migrations: external
  health-check:
    database: true
  browser-backend:
    telemetry_service_name: hypershell-web-console
    api_prefix: /api/hypershell/v1
    logout_scope: identity_provider
    roles_claim: resource_access.hypershell.roles
    routes:
      - /
      - /login
      - /metrics
      - /gateways/new
      - /gateways/{id}
    asset_bundle: ui/build.zip
