# The controller uses this service account through a projected, short-lived token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-controller
  namespace: hypershell-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypershell-database-controller
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, configmaps, persistentvolumeclaims, services]
    verbs: [get, create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypershell-database-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hypershell-database-controller
subjects:
  - kind: ServiceAccount
    name: database-controller
    namespace: hypershell-control-plane
