# Use a projected token. The count controller only reads Pod state.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-count-controller
  namespace: hypershell-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hypershell-sandbox-count-controller
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hypershell-sandbox-count-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hypershell-sandbox-count-controller
subjects:
  - kind: ServiceAccount
    name: sandbox-count-controller
    namespace: hypershell-control-plane
