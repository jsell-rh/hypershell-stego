syntax = "proto3";
package hypershell.controlplane.v1;
import "hypershell/v1/gateways.proto";

// This contract supplies privileged state to Hypershell Gateway controllers.
// A denied or missing row must never cause provider deletion.
service GatewayIdentityService {
 rpc SetObservedSandboxCount(SetObservedSandboxCountRequest) returns (SetObservedSandboxCountResponse);
 rpc ListGatewayReconcileIDs(ListGatewayReconcileIDsRequest) returns (ListGatewayReconcileIDsResponse);
 rpc ListGatewayIdentityUsers(ListGatewayIdentityUsersRequest) returns (ListGatewayIdentityUsersResponse);
 rpc GetGatewayIdentityUser(GetGatewayIdentityUserRequest) returns (GetGatewayIdentityUserResponse);
 rpc GetGatewayIdentityState(GetGatewayIdentityStateRequest) returns (GetGatewayIdentityStateResponse);
}
message GetGatewayIdentityStateRequest { string id = 1; }
message GetGatewayIdentityStateResponse {
 hypershell.v1.Gateway gateway = 1;
 bool deleted = 2;
}

// Pages contain retained grant references, including deleted grants.
message ListGatewayIdentityUsersRequest { string gateway_id = 1; int32 page = 2; }
message ListGatewayIdentityUsersResponse { repeated string user_ids = 1; bool has_more = 2; }
message GetGatewayIdentityUserRequest { string gateway_id = 1; string user_id = 2; }
message GetGatewayIdentityUserResponse {
 string gateway_id = 1;
 string user_id = 2;
 string issuer = 3;
 string subject = 4;
 // Empty means that no live grant permits access.
 string role = 5;
}

// Recovery includes live and deleted rows. Only configured controllers can read
// these IDs. Pages contain at most 100 IDs in database ID order. Start a live watch
// before the first page, and repeat the scan to recover concurrent changes.
message ListGatewayReconcileIDsRequest { string after_id = 1; }
message ListGatewayReconcileIDsResponse { repeated string ids = 1; }

// The current cluster assignment is checked under the same row lock as the count.
message SetObservedSandboxCountRequest { string namespace = 1; string cluster_id = 2; int32 count = 3; }
message SetObservedSandboxCountResponse { int32 count = 1; }
