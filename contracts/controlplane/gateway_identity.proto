syntax = "proto3";
package hypershell.controlplane.v1;
import "hypershell/v1/gateways.proto";
import "hypershell/controlplane/v1/database_cleanup.proto";

// This contract supplies privileged state to Hypershell Gateway controllers.
// A denied or missing row must never cause provider deletion.
service GatewayIdentityService {
 rpc LoadGatewayIdentityCycle(LoadGatewayIdentityCheckpointRequest) returns (GatewayIdentityCycle);
 rpc SaveGatewayIdentityCycle(SaveGatewayIdentityCycleRequest) returns (GatewayIdentityCycle);
 rpc ObserveGatewayIdentity(ObserveGatewayIdentityRequest) returns (ObserveGatewayIdentityResponse);
 rpc LoadGatewayIdentityCheckpoint(LoadGatewayIdentityCheckpointRequest) returns (GatewayIdentityCheckpoint);
 rpc SaveGatewayIdentityCheckpoint(SaveGatewayIdentityCheckpointRequest) returns (GatewayIdentityCheckpoint);
 rpc GetGatewayCleanupSummary(GetGatewayCleanupSummaryRequest) returns (CleanupSummary);
 rpc ObserveGatewayCleanup(ObserveGatewayCleanupRequest) returns (ObserveGatewayCleanupResponse);
 rpc SetObservedSandboxCount(SetObservedSandboxCountRequest) returns (SetObservedSandboxCountResponse);
 rpc ListGatewayReconcileIDs(ListGatewayReconcileIDsRequest) returns (ListGatewayReconcileIDsResponse);
 rpc ScanGatewayIdentityUsers(ScanGatewayIdentityUsersRequest) returns (ScanGatewayIdentityUsersResponse);
 rpc ListGatewayIdentityUsers(ListGatewayIdentityUsersRequest) returns (ListGatewayIdentityUsersResponse);
 rpc GetGatewayIdentityUser(GetGatewayIdentityUserRequest) returns (GetGatewayIdentityUserResponse);
 rpc GetGatewayIdentityState(GetGatewayIdentityStateRequest) returns (GetGatewayIdentityStateResponse);
}
message GetGatewayIdentityStateRequest { string id = 1; }
message GetGatewayIdentityStateResponse {
 hypershell.v1.Gateway gateway = 1;
 bool deleted = 2;
 // Use this revision for status writes after external work.
 int64 resource_version = 3;
 int64 resource_generation = 4;
 int64 observed_generation = 5;
 map<string, bool> cleanup = 6;
 map<string, CleanupTargetObservations> cleanup_targets = 7;
 map<string, ResourceConditions> conditions = 8;
}

// Pages contain retained grant references, including deleted grants.
message ListGatewayIdentityUsersRequest { string gateway_id = 1; int32 page = 2; }
message ListGatewayIdentityUsersResponse { repeated string user_ids = 1; bool has_more = 2; }
message GetGatewayIdentityUserRequest { string gateway_id = 1; string user_id = 2; }
message GetGatewayIdentityUserResponse {
 string gateway_id = 1;
 string user_id = 2;
 string issuer = 3;
 string subject = 4;
 // Empty means that no live grant permits access.
 string role = 5;
}

// Recovery includes live and deleted rows. Only configured controllers can read
// these IDs. Pages contain at most 100 IDs in database ID order. Start a live watch
// before the first page, and repeat the scan to recover concurrent changes.
message ListGatewayReconcileIDsRequest { string after_id = 1; }
message ListGatewayReconcileIDsResponse { repeated string ids = 1; }

// The current cluster assignment is checked under the same row lock as the count.
message SetObservedSandboxCountRequest { string namespace = 1; string cluster_id = 2; int32 count = 3; }
message SetObservedSandboxCountResponse { int32 count = 1; }

message ObserveGatewayCleanupRequest { string id = 1; string owner = 2; bool complete = 3; string target = 4; }
message ObserveGatewayCleanupResponse {}

message CleanupTargetObservations { map<string, bool> targets = 1; }

// Cursor recovery has no total count or row offset. References include retained
// deleted grants. Each grant ID can be used to resume a partial page. Read each
// user's current identity state before provider work. Repeat full scans to catch
// changes before a saved cursor. This is not a snapshot or acknowledgment.
message ScanGatewayIdentityUsersRequest {
 string gateway_id = 1;
 string after_grant_id = 2;
 int32 page_size = 3;
}
message GatewayIdentityUserReference { string grant_id = 1; string user_id = 2; }
message ScanGatewayIdentityUsersResponse {
 string gateway_id = 1;
 string after_grant_id = 2;
 repeated GatewayIdentityUserReference references = 3;
 bool has_more = 4;
}

message GetGatewayCleanupSummaryRequest { string owner = 1; string target = 2; }

// The identity controller stores one grant cursor per Gateway. A version check
// rejects stale saves. An empty cursor starts another full scan. This progress
// does not grant access, acknowledge an event, or lock provider actions.
message LoadGatewayIdentityCheckpointRequest { string gateway_id = 1; }
message SaveGatewayIdentityCheckpointRequest { string gateway_id = 1; int64 expected_version = 2; string after_grant_id = 3; }
message GatewayIdentityCheckpoint { string gateway_id = 1; int64 version = 2; string after_grant_id = 3; }

// Conditions describe one owner at a specific desired generation. The API
// returns Unknown with ObservationPending for an older generation.
message ResourceConditions { map<string, ResourceCondition> conditions = 1; }
message ResourceCondition {
 string status = 1;
 string reason = 2;
 string message = 3;
 int64 observed_generation = 4;
 // RFC 3339 time from PostgreSQL. Empty means no current observation.
 string last_transition_time = 5;
 bool current = 6;
}
// OIDC is present only after a successful provider operation. Reason is a fixed
// Hypershell code. Provider error text is not accepted. Use the resource revision
// read before the operation in the request metadata.
message ObserveGatewayIdentityRequest { string id = 1; optional string oidc = 2; string reason = 3; }
message ObserveGatewayIdentityResponse {}

// Data is a bounded STEGO scan-cycle record. The generation and checkpoint
// version identify the input observed before work. A stale save must fail.
message GatewayIdentityCycle { string gateway_id = 1; string data = 2; int64 version = 3; int64 resource_generation = 4; }
message SaveGatewayIdentityCycleRequest { string gateway_id = 1; string data = 2; int64 expected_version = 3; int64 resource_generation = 4; }
