syntax = "proto3";
package hypershell.provisioner.v1;

// Only an explicitly granted worker for the current cluster can read this
// credential. It is never part of a public Gateway response or event.
service GatewayConsoleCredentialService {
 rpc GetCredentials(GatewayConsoleCredentialRequest) returns (GatewayConsoleCredentialResponse);
}
message GatewayConsoleCredentialRequest {
 string gateway_id = 1;
 string cluster_id = 2;
 int64 resource_version = 3;
}
message GatewayConsoleCredentialResponse {
 string client_id = 1;
 string client_secret = 2;
}
