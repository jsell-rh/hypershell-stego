syntax = "proto3";
package hypershell.provisioner.v1;

// Internal discovery does not prove ownership or complete cleanup.
// Each candidate needs a current ownership read and a saved closure.
service GatewayAccountInventoryService {
 rpc GetSource(GatewayAccountInventorySourceRequest) returns (GatewayAccountInventorySource);
 rpc ReadPage(GatewayAccountInventoryPageRequest) returns (GatewayAccountInventoryPage);
 rpc PrepareCandidate(PrepareGatewayAccountCandidateRequest) returns (PrepareGatewayAccountCandidateResponse);
}
message GatewayAccountInventorySourceRequest { string gateway_id = 1; }
message GatewayAccountInventorySource { string source_version = 1; }
message GatewayAccountInventoryPageRequest {
 string gateway_id = 1;
 string source_version = 2;
 string after = 3;
 int32 limit = 4;
}
message GatewayAccountInventoryCandidate { string cursor = 1; string provider_id = 2; }
message GatewayAccountInventoryPage {
 repeated GatewayAccountInventoryCandidate candidates = 1;
 bool more = 2;
 // A failed boundary requires another full scan. It is never an empty end.
 bool window_limit = 3;
}
message PrepareGatewayAccountCandidateRequest {
 string gateway_id = 1;
 string source_version = 2;
 string provider_id = 3;
}
message PrepareGatewayAccountCandidateResponse { bool owned = 1; }
