kind: service
name: hypershell
archetype: service-core
language: go
component_namespaces:
  jwt-auth: auth
  kafka-producer: events
  outbox: outbox
  postgres-adapter: storage
  tsl-search: search
base_path: /api/hypershell/v1

entities:
  - name: User
    fields:
      - { name: username, type: string, min_length: 1, max_length: 255 }
      - { name: issuer, type: string, optional: true, max_length: 1024, unique_composite: [issuer, subject] }
      - { name: subject, type: string, optional: true, max_length: 255, unique_composite: [issuer, subject] }
      - { name: email, type: string, max_length: 320 }
      - { name: name, type: string, max_length: 255 }
  - name: Role
    fields:
      - { name: name, type: string, unique: true, max_length: 64 }

      - { name: display_name, type: string, optional: true, max_length: 255 }
      - { name: description, type: string, optional: true, max_length: 1024 }
      - { name: permissions, type: jsonb, optional: true }
      - { name: built_in, type: bool }
  - name: ManagedCluster
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: provider, type: string, min_length: 1, max_length: 64 }
      - { name: region, type: string, optional: true, max_length: 255 }
      - { name: kubeconfig_secret, type: string, min_length: 1, max_length: 253 }
      - { name: status, type: string, optional: true, max_length: 255 }
      - { name: api_server_url, type: string, optional: true, max_length: 2048 }
  - name: GatewayRelease
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: image, type: string, min_length: 1, max_length: 2048 }
      - { name: rollout_strategy, type: string, optional: true, max_length: 64 }
      - { name: canary_percent, type: int32, optional: true, min: 0, max: 100 }
      - { name: canary_duration, type: string, optional: true, max_length: 64 }
      - { name: status, type: string, optional: true, max_length: 255 }
  - name: GatewayNetwork
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: topology, type: string, optional: true, max_length: 64 }
      - { name: tunnel_mode, type: string, optional: true, max_length: 64 }
      - { name: hub_gateway_id, type: string, optional: true, max_length: 255 }
      - { name: status, type: string, optional: true, max_length: 255 }
  - name: Gateway
    versioned: true
    conditions: {identity: [ClientReady], identity_users: [GrantsSynchronized]}
    cleanup_owners: [identity, workload, sql, accounts, allocation]
    cleanup_targets: {workload: cluster_id, sql: cluster_id, allocation: cluster_id}
    generation_fields: [name, cluster_id, release_id, namespace, external_dns, tls_mode, service_type, image, supervisor_image, server_dns_names, oidc, route, credential_driver]
    observations:
      workload: [phase, status]
      endpoint: [route_address]
      console: [console_address]
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: cluster_id, type: ref, to: ManagedCluster }
      - { name: release_id, type: ref, to: GatewayRelease }
      - { name: namespace, type: string, unique: true, max_length: 26 }
      - { name: external_dns, type: string, optional: true }
      - { name: tls_mode, type: string, optional: true }
      - { name: service_type, type: string, optional: true }
      - { name: status, type: string, optional: true, unobserved: ObservationPending, deleting: Gateway cleanup is in progress }
      - { name: phase, type: string, optional: true, unobserved: Provisioning, deleting: Deleting }
      - { name: image, type: string, optional: true }
      - { name: supervisor_image, type: string, optional: true }
      - { name: server_dns_names, type: jsonb, optional: true }
      - { name: route_address, type: string, optional: true, unobserved: "" }
      - { name: console_address, type: string, optional: true, unobserved: "" }
      - { name: oidc, type: string, optional: true }
      - { name: route, type: string, optional: true }
      - { name: credential_driver, type: string, optional: true }
      - { name: active_sandbox_count, type: int32, optional: true }
  - name: RoleBinding
    fields:
      - { name: user_id, type: ref, to: User, unique_composite: [gateway_id, role_id, user_id], unique_when_live: true }
      - { name: role_id, type: ref, to: Role, unique_composite: [gateway_id, role_id, user_id], unique_when_live: true }
      - { name: gateway_id, type: ref, to: Gateway, optional: true, unique_composite: [gateway_id, role_id, user_id], unique_when_live: true }
      - { name: scope, type: enum, values: [gateway, global] }

  - name: ServiceAccount
    fields:
      - { name: gateway_id, type: ref, to: Gateway, unique_composite: [gateway_id, active_name] }
      - { name: active_name, type: string, optional: true, unique_composite: [gateway_id, active_name], max_length: 128 }
      - { name: name, type: string, min_length: 1, max_length: 128 }
      - { name: description, type: string, optional: true, max_length: 1024 }
      - { name: credential_type, type: enum, values: [client_secret] }
      - { name: role, type: enum, values: [openshell-user, openshell-admin] }
      - { name: status, type: enum, values: [provisioning, ready, degraded, expired, revoking, revoked, deleting, error] }
      - { name: created_by_user_id, type: ref, to: User }
      - { name: client_id, type: string, unique: true, max_length: 128 }
      - { name: client_uuid, type: string, max_length: 255 }
      - { name: subject, type: string, max_length: 255 }
      - { name: expires_at, type: timestamp }
      - { name: revoked_at, type: timestamp, optional: true }
      - { name: last_error, type: string, optional: true, max_length: 64 }
      - { name: active, type: bool }
  - name: ServiceAccountAudit
    fields:
      - { name: service_account_id, type: ref, to: ServiceAccount }
      - { name: gateway_id, type: ref, to: Gateway }
      - { name: actor_user_id, type: string, max_length: 64 }
      - { name: creator_user_id, type: ref, to: User }
      - { name: action, type: string, max_length: 32 }
      - { name: outcome, type: string, max_length: 32 }
      - { name: role, type: string, max_length: 32 }
      - { name: expires_at, type: timestamp }

collections: {}
slots: []

overrides:
  runtime-configuration:
    groups:
      - name: ControlAPI
        fields:
          - {"name": "Address", "env": "HYPERSHELL_API_GRPC_ADDR", "type": "string", "min_length": 1, "max_length": 512}
          - {"name": "CAFile", "env": "HYPERSHELL_API_CA_FILE", "type": "string", "min_length": 1, "max_length": 4096}
          - {"name": "TokenFile", "env": "HYPERSHELL_API_TOKEN_FILE", "type": "string", "min_length": 1, "max_length": 4096}
      - name: ClusterWorker
        fields:
          - {"name": "ServerURL", "env": "HYPERSHELL_KUBERNETES_URL", "type": "string", "min_length": 1, "max_length": 4096}
          - {"name": "CAFile", "env": "HYPERSHELL_KUBERNETES_CA_FILE", "type": "string", "min_length": 0, "max_length": 4096, "default": ""}
          - {"name": "TokenFile", "env": "HYPERSHELL_KUBERNETES_TOKEN_FILE", "type": "string", "min_length": 1, "max_length": 4096}
          - {"name": "ControlNamespace", "env": "HYPERSHELL_CONTROL_NAMESPACE", "type": "string", "min_length": 1, "max_length": 63}
          - {"name": "ClusterID", "env": "HYPERSHELL_MANAGED_CLUSTER_ID", "type": "string", "min_length": 1, "max_length": 128}
          - {"name": "SandboxRuntimeClass", "env": "HYPERSHELL_GATEWAY_SANDBOX_RUNTIME_CLASS", "type": "string", "min_length": 0, "max_length": 63, "default": ""}
      - name: NamespaceWorker
        fields:
          - {"name": "ConsoleDomain", "env": "HYPERSHELL_GATEWAY_CONSOLE_DOMAIN", "type": "string", "min_length": 0, "max_length": 253, "default": ""}
      - name: SandboxCounter
        fields:
          - {"name": "WatchLimit", "env": "HYPERSHELL_SANDBOX_COUNT_WATCH_LIMIT", "type": "integer", "min": "0", "max": "128", "default": "0"}
          - {"name": "Resync", "env": "HYPERSHELL_SANDBOX_COUNT_RESYNC", "type": "duration", "min": "0s", "max": "5m", "default": "0s"}
  kubernetes-service:
    source_directories: [internal, contracts]
    dns_namespace: openshift-dns
    dns_port: 5353
    rpc_processes:
      - name: provisioner
        component: grpc-application
        process: provisioner
        rollout_strategy: Recreate
        network_peers:
          - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell-gateway-workload, port: 9090, protocol: TCP}
          - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell, port: 9090, protocol: TCP}
          - {direction: ingress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 9090, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell, port: 9090, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19094, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: identity-fixture, port: 8443, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
    allocation_roles:
      - name: fixture-gateway-inspector
        scope: namespace
        rules:
          - {api_group: "", resources: [configmaps], resource_names: [openshell-gateway-config], verbs: [get]}
          - {api_group: "", resources: [secrets], resource_names: [openshell-client-tls, openshell-gateway-db-credentials, openshell-gateway-keys, openshell-public-tls, openshell-server-tls, hypershell-gateway-console-files], verbs: [get]}
          - {api_group: "", resources: [resourcequotas], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
          - {api_group: "", resources: [pods], verbs: [get, list, watch, create, delete]}
          - {api_group: "", resources: [pods/log], verbs: [get]}
          - {api_group: "", resources: [serviceaccounts], verbs: [get]}
          - {api_group: apps, resources: [deployments], resource_names: [hypershell-gateway-console, openshell-gateway], verbs: [get, list, watch]}
          - {api_group: cert-manager.io, resources: [certificates], resource_names: [openshell-public-tls], verbs: [get]}
          - {api_group: cert-manager.io, resources: [certificates/status], resource_names: [openshell-public-tls], verbs: [update]}
      - name: fixture-state-inspector
        scope: namespace
        rules:
          - {api_group: "", resources: [secrets], resource_names: [openshell-gateway-state], verbs: [get]}
          - {api_group: "", resources: [resourcequotas], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
      - name: fixture-console-state-inspector
        scope: namespace
        rules:
          - {api_group: "", resources: [secrets], resource_names: [gateway-console-state], verbs: [get]}
          - {api_group: "", resources: [resourcequotas], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
      - name: fixture-sandbox-inspector
        scope: namespace
        rules:
          - {api_group: "", resources: [secrets], resource_names: [openshell-client-tls], verbs: [get]}
          - {api_group: "", resources: [resourcequotas], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
          - {api_group: "", resources: [pods], verbs: [get, list, watch, create, delete]}
          - {api_group: "", resources: [pods/log], verbs: [get]}
          - {api_group: "", resources: [serviceaccounts], verbs: [get]}
          - {api_group: rbac.authorization.k8s.io, resources: [rolebindings], verbs: [get, list]}
      - name: sandbox-count
        scope: namespace
        rules:
          - {api_group: "", resources: [pods], verbs: [get, list, watch]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
      - name: gateway-state
        scope: namespace
        rules:
          - {api_group: "", resources: [secrets, configmaps], verbs: [get, create]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
      - name: gateway-worker
        scope: namespace
        rules:
          - {api_group: "", resources: [secrets, configmaps, services], verbs: [get, create, patch]}
          - {api_group: "", resources: [serviceaccounts], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
          - {api_group: apps, resources: [deployments], verbs: [get, create, patch]}
          - {api_group: cert-manager.io, resources: [certificates], verbs: [get, create, patch]}
          - {api_group: route.openshift.io, resources: [routes], verbs: [get, create, patch, delete]}
          - {api_group: route.openshift.io, resources: [routes/custom-host], verbs: [create]}
      - name: gateway-runtime
        scope: namespace
        rules:
          - {api_group: agents.x-k8s.io, resources: [sandboxes, sandboxes/status], verbs: [get, list, watch, create, update, patch, delete]}
          - {api_group: "", resources: [events], verbs: [get, list, watch]}
          - {api_group: "", resources: [pods], verbs: [get]}
      - name: gateway-reviews
        scope: cluster
        rules:
          - {api_group: authentication.k8s.io, resources: [tokenreviews], verbs: [create]}
          - {api_group: "", resources: [nodes], verbs: [get, list, watch]}
          - {api_group: "", resources: [namespaces], verbs: [get]}
      - name: sandbox-worker
        scope: namespace
        rules:
          - {api_group: "", resources: [secrets], verbs: [get, create, patch]}
          - {api_group: "", resources: [pods], verbs: [get, create]}
          - {api_group: "", resources: [serviceaccounts], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], resource_names: [stego-allocation], verbs: [get]}
          - {api_group: networking.k8s.io, resources: [networkpolicies], verbs: [list]}
    allocation_profiles:
      - name: gateway
        service_accounts: [gateway, console]
        network_isolation: true
        network_endpoints: [kubernetes]
        network_peers:
          - {direction: ingress, namespace: external, external_namespace: openshift-ingress, pod_label: ingresscontroller.operator.openshift.io/deployment-ingresscontroller, pod_value: default, port: 8080, protocol: TCP}
          - {direction: ingress, namespace: control, pod_label: app, pod_value: stego-fixture, port: 8080, protocol: TCP}
          - {direction: egress, namespace: external, external_namespace: openshift-dns, pod_label: dns.operator.openshift.io/daemonset-dns, pod_value: default, port: 5353, protocol: UDP}
          - {direction: egress, namespace: external, external_namespace: openshift-dns, pod_label: dns.operator.openshift.io/daemonset-dns, pod_value: default, port: 5353, protocol: TCP}
          - {direction: egress, namespace: control, pod_label: app, pod_value: stego-fixture, port: 5432, protocol: TCP}
          - {direction: egress, namespace: control, pod_label: app, pod_value: identity-fixture, port: 8443, protocol: TCP}
          - {direction: egress, namespace: control, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
          - {direction: ingress, namespace: external, external_namespace: openshift-ingress, pod_label: ingresscontroller.operator.openshift.io/deployment-ingresscontroller, pod_value: default, port: 8443, protocol: TCP}
          - {direction: ingress, namespace: control, pod_label: app, pod_value: stego-fixture, port: 8443, protocol: TCP}
          - {direction: ingress, namespace: allocated, pod_label: app.kubernetes.io/name, pod_value: hypershell-gateway-console, port: 8080, protocol: TCP}
          - {direction: egress, namespace: allocated, pod_label: app.kubernetes.io/name, pod_value: openshell-gateway, port: 8080, protocol: TCP}
          - {direction: ingress, namespace: profile, peer_profile: sandbox, pod_exists_label: agents.x-k8s.io/sandbox-name-hash, port: 8080, protocol: TCP}
          - {direction: egress, namespace: profile, peer_profile: sandbox, pod_exists_label: agents.x-k8s.io/sandbox-name-hash, port: 2222, protocol: TCP}
        namespace_prefix: openshell-
        suffix_length: 16
        owner_label: hypershell.redhat.io/gateway-id
        manager: hypershell-gateway-controller
        quota:
          - {resource: pods, value: "3"}
          - {resource: limits.cpu, value: "4500m"}
          - {resource: limits.memory, value: 2560Mi}
          - {resource: limits.ephemeral-storage, value: 768Mi}
          - {resource: requests.storage, value: 2Gi}
        bindings:
          - {role: gateway-worker, service_account: hypershell-gateway-workload, namespace: control}
          - {role: gateway-runtime, service_account: gateway, namespace: allocated}
          - {role: gateway-reviews, service_account: gateway, namespace: allocated}
          - {external_role: "system:openshift:scc:nonroot-v2", service_account: gateway, namespace: allocated}
          - {external_role: "system:openshift:scc:nonroot-v2", service_account: console, namespace: allocated}
          - {role: sandbox-count, service_account: hypershell-sandbox-count, namespace: control}
          - {role: fixture-gateway-inspector, service_account: service-check, namespace: control}
      - name: sandbox
        service_accounts: [sandbox]
        namespace_prefix: openshell-sandbox-
        suffix_length: 16
        owner_label: hypershell.redhat.io/gateway-id
        manager: hypershell-gateway-controller
        pod_security: isolated-runtime
        pod_network_provider: openshift-ovn-node-identity
        pod_runtime_class: kata
        pod_service_account: sandbox
        pod_annotations: [openshell.io/sandbox-id, agents.x-k8s.io/propagated-labels, agents.x-k8s.io/propagated-annotations]
        pod_capability_grants:
          - name: openshell-network-init
            image: quay.io/opendatahub/odh-openshell-supervisor:v0.0.109-rhaiv.0@sha256:96e21135c18bc9f6f4d1dfd0cccae3c91769ef4d87da2e470eca4b56a24b2152
            capabilities: [NET_ADMIN, NET_RAW, CHOWN, FOWNER]
          - name: openshell-supervisor-network
            image: quay.io/opendatahub/odh-openshell-supervisor:v0.0.109-rhaiv.0@sha256:96e21135c18bc9f6f4d1dfd0cccae3c91769ef4d87da2e470eca4b56a24b2152
            capabilities: [SYS_PTRACE, DAC_READ_SEARCH]
        pod_validations:
          - expression: "variables.containers.all(c, c.name in ['agent','workspace-init','openshell-network-init','openshell-supervisor-network'])"
            message: Sandbox container names must match OpenShell
          - expression: "variables.containers.all(c, !(c.name in ['openshell-network-init','openshell-supervisor-network']) || c.image == 'quay.io/opendatahub/odh-openshell-supervisor:v0.0.109-rhaiv.0@sha256:96e21135c18bc9f6f4d1dfd0cccae3c91769ef4d87da2e470eca4b56a24b2152')"
            message: Sandbox network helpers must use the selected supervisor image
          - expression: "variables.containers.all(c, c.name != 'agent' || (has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot && has(c.securityContext.runAsUser) && c.securityContext.runAsUser != 0 && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop))"
            message: Sandbox workloads must run as a non-root user without extra capabilities
          - expression: "variables.containers.all(c, !(c.name in ['agent','workspace-init']) || !has(c.volumeMounts) || c.volumeMounts.all(m, !(m.name in ['openshell-client-tls','openshell-sa-token'])))"
            message: Sandbox workloads and workspace helpers cannot mount client credentials
          - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) && (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef))))"
            message: Sandbox containers cannot read Secrets through environment variables
          - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.image) && v.image.reference == 'quay.io/opendatahub/odh-openshell-supervisor:v0.0.109-rhaiv.0@sha256:96e21135c18bc9f6f4d1dfd0cccae3c91769ef4d87da2e470eca4b56a24b2152') || (has(v.secret) && v.name == 'openshell-client-tls' && v.secret.secretName == 'openshell-client-tls') || (has(v.projected) && v.name == 'openshell-sa-token' && v.projected.sources.all(s, has(s.serviceAccountToken) && has(s.serviceAccountToken.audience) && s.serviceAccountToken.audience == 'openshell-gateway' && has(s.serviceAccountToken.expirationSeconds) && s.serviceAccountToken.expirationSeconds <= 3600)) || (has(v.persistentVolumeClaim) && v.name == 'workspace' && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, o.kind == 'Sandbox' && o.apiVersion.startsWith('agents.x-k8s.io/') && has(o.controller) && o.controller && v.persistentVolumeClaim.claimName == 'workspace-' + o.name)))"
            message: Sandbox storage must match OpenShell workspace and identity rules
        network_isolation: true
        network_peers:
          - {direction: egress, namespace: external, external_namespace: openshift-dns, pod_label: dns.operator.openshift.io/daemonset-dns, pod_value: default, port: 5353, protocol: UDP}
          - {direction: egress, namespace: external, external_namespace: openshift-dns, pod_label: dns.operator.openshift.io/daemonset-dns, pod_value: default, port: 5353, protocol: TCP}
          - {direction: egress, namespace: profile, peer_profile: gateway, pod_label: app.kubernetes.io/name, pod_value: openshell-gateway, port: 8080, protocol: TCP}
          - {direction: ingress, namespace: profile, peer_profile: gateway, pod_label: app.kubernetes.io/name, pod_value: openshell-gateway, port: 2222, protocol: TCP}
        quota:
          - {resource: pods, value: "32"}
          - {resource: limits.cpu, value: "64"}
          - {resource: limits.memory, value: 64Gi}
          - {resource: limits.ephemeral-storage, value: 16Gi}
          - {resource: requests.storage, value: 64Gi}
        bindings:
          - {role: sandbox-worker, service_account: hypershell-gateway-workload, namespace: control}
          - {role: sandbox-count, service_account: hypershell-sandbox-count, namespace: control}
          - {role: gateway-runtime, service_account: gateway, namespace: profile, subject_profile: gateway}
          - {external_role: "system:openshift:scc:privileged", service_account: sandbox, namespace: allocated}
          - {role: fixture-sandbox-inspector, service_account: service-check, namespace: control}
      - name: gateway-state
        network_isolation: true
        identity_config_map: openshell-state-identity
        identity_annotations:
          - {field: sha256, key: hypershell.redhat.io/state-identity}
        namespace_prefix: openshell-state-
        suffix_length: 40
        owner_label: hypershell.redhat.io/gateway-id
        manager: hypershell-gateway-controller
        quota:
          - {resource: pods, value: "0"}
          - {resource: limits.cpu, value: "1"}
          - {resource: limits.memory, value: 64Mi}
