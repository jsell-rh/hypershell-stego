kind: service
name: hypershell
archetype: service-core
language: go
base_path: /api/hypershell/v1

entities:
  - name: User
    fields:
      - { name: username, type: string, min_length: 1, max_length: 255 }
      - { name: issuer, type: string, optional: true, max_length: 1024, unique_composite: [issuer, subject] }
      - { name: subject, type: string, optional: true, max_length: 255, unique_composite: [issuer, subject] }
      - { name: email, type: string, max_length: 320 }
      - { name: name, type: string, max_length: 255 }
  - name: Role
    fields:
      - { name: name, type: string, unique: true, max_length: 64 }

      - { name: display_name, type: string, optional: true, max_length: 255 }
      - { name: description, type: string, optional: true, max_length: 1024 }
      - { name: permissions, type: jsonb, optional: true }
      - { name: built_in, type: bool }
  - name: ManagedCluster
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: provider, type: string, min_length: 1, max_length: 64 }
      - { name: region, type: string, optional: true, max_length: 255 }
      - { name: kubeconfig_secret, type: string, min_length: 1, max_length: 253 }
      - { name: status, type: string, optional: true, max_length: 255 }
      - { name: api_server_url, type: string, optional: true, max_length: 2048 }
  - name: GatewayRelease
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: image, type: string, min_length: 1, max_length: 2048 }
      - { name: rollout_strategy, type: string, optional: true, max_length: 64 }
      - { name: canary_percent, type: int32, optional: true, min: 0, max: 100 }
      - { name: canary_duration, type: string, optional: true, max_length: 64 }
      - { name: status, type: string, optional: true, max_length: 255 }
  - name: ManagedDatabase
    versioned: true
    cleanup_owners: [provider]
    fields:
      - { name: name, type: string, min_length: 1, max_length: 261 }
      - { name: provider, type: enum, values: [cnpg, deployment] }
      - { name: namespace, type: string, min_length: 1, max_length: 29, unique: true }
      - { name: region, type: string, optional: true, max_length: 255 }
      - { name: engine, type: string, optional: true, max_length: 64 }
      - { name: engine_version, type: string, optional: true, max_length: 64 }
      - { name: instance_class, type: string, optional: true, max_length: 255 }
      - { name: connection_secret, type: string, optional: true, max_length: 253 }
      - { name: status, type: string, optional: true, max_length: 255 }
  - name: GatewayNetwork
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: topology, type: string, optional: true, max_length: 64 }
      - { name: tunnel_mode, type: string, optional: true, max_length: 64 }
      - { name: hub_gateway_id, type: string, optional: true, max_length: 255 }
      - { name: status, type: string, optional: true, max_length: 255 }
  - name: Gateway
    versioned: true
    conditions: {identity: [ClientReady], identity_users: [GrantsSynchronized]}
    cleanup_owners: [identity, workload]
    cleanup_targets: {workload: cluster_id}
    generation_fields: [name, cluster_id, release_id, database_id, namespace, external_dns, tls_mode, service_type, image, supervisor_image, server_dns_names, route_address, oidc, route, credential_driver]
    observations:
      workload: [phase, status]
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: cluster_id, type: ref, to: ManagedCluster }
      - { name: release_id, type: ref, to: GatewayRelease }
      - { name: database_id, type: ref, to: ManagedDatabase }
      - { name: namespace, type: string, unique: true, max_length: 26 }
      - { name: external_dns, type: string, optional: true }
      - { name: tls_mode, type: string, optional: true }
      - { name: service_type, type: string, optional: true }
      - { name: status, type: string, optional: true, unobserved: ObservationPending }
      - { name: phase, type: string, optional: true, unobserved: Provisioning }
      - { name: image, type: string, optional: true }
      - { name: supervisor_image, type: string, optional: true }
      - { name: server_dns_names, type: jsonb, optional: true }
      - { name: route_address, type: string, optional: true }
      - { name: console_address, type: string, optional: true }
      - { name: oidc, type: string, optional: true }
      - { name: route, type: string, optional: true }
      - { name: credential_driver, type: string, optional: true }
      - { name: active_sandbox_count, type: int32, optional: true }
  - name: RoleBinding
    fields:
      - { name: user_id, type: ref, to: User, unique_composite: [gateway_id, role_id, user_id], unique_when_live: true }
      - { name: role_id, type: ref, to: Role, unique_composite: [gateway_id, role_id, user_id], unique_when_live: true }
      - { name: gateway_id, type: ref, to: Gateway, optional: true, unique_composite: [gateway_id, role_id, user_id], unique_when_live: true }
      - { name: scope, type: enum, values: [gateway, global] }

  - name: ServiceAccount
    fields:
      - { name: gateway_id, type: ref, to: Gateway, unique_composite: [gateway_id, active_name] }
      - { name: active_name, type: string, optional: true, unique_composite: [gateway_id, active_name], max_length: 128 }
      - { name: name, type: string, min_length: 1, max_length: 128 }
      - { name: description, type: string, optional: true, max_length: 1024 }
      - { name: credential_type, type: enum, values: [client_secret] }
      - { name: role, type: enum, values: [openshell-user, openshell-admin] }
      - { name: status, type: enum, values: [provisioning, ready, degraded, expired, revoking, revoked, deleting, error] }
      - { name: created_by_user_id, type: ref, to: User }
      - { name: client_id, type: string, unique: true, max_length: 128 }
      - { name: client_uuid, type: string, max_length: 255 }
      - { name: subject, type: string, max_length: 255 }
      - { name: expires_at, type: timestamp }
      - { name: revoked_at, type: timestamp, optional: true }
      - { name: last_error, type: string, optional: true, max_length: 64 }
      - { name: active, type: bool }
  - name: ServiceAccountAudit
    fields:
      - { name: service_account_id, type: ref, to: ServiceAccount }
      - { name: gateway_id, type: ref, to: Gateway }
      - { name: actor_user_id, type: string, max_length: 64 }
      - { name: creator_user_id, type: ref, to: User }
      - { name: action, type: string, max_length: 32 }
      - { name: outcome, type: string, max_length: 32 }
      - { name: role, type: string, max_length: 32 }
      - { name: expires_at, type: timestamp }

collections: {}
slots: []

overrides:
  kubernetes-service:
    source_directories: [internal, contracts]
    dns_namespace: openshift-dns
    dns_port: 5353
    workers:
      - name: database
        package: internal/databaseapp
        function: Run
        external_endpoints: [kubernetes]
        network_peers:
          - {direction: egress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell, port: 9090, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
      - name: gateway-workload
        package: internal/gatewayworkloadapp
        function: Run
        external_endpoints: [kubernetes]
        network_peers:
          - {direction: egress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell, port: 9090, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
      - name: sandbox-count
        package: internal/sandboxcountapp
        function: Run
        external_endpoints: [kubernetes]
        network_peers:
          - {direction: egress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell, port: 9090, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
      - name: gateway-identity
        package: internal/gatewayidentityapp
        function: Run
        network_peers:
          - {direction: egress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell, port: 9090, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: identity-fixture, port: 8443, protocol: TCP}
          - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
    network_peers:
      - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell-console, port: 8443, protocol: TCP}
      - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell-gateway-identity, port: 9090, protocol: TCP}
      - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell-database, port: 9090, protocol: TCP}
      - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell-gateway-workload, port: 9090, protocol: TCP}
      - {direction: ingress, namespace: self, pod_label: app.kubernetes.io/name, pod_value: hypershell-sandbox-count, port: 9090, protocol: TCP}
      - {direction: ingress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 8443, protocol: TCP}
      - {direction: ingress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 9090, protocol: TCP}
      - {direction: egress, namespace: self, pod_label: app, pod_value: identity-fixture, port: 8443, protocol: TCP}
      - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 5432, protocol: TCP}
      - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19092, protocol: TCP}
      - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19094, protocol: TCP}
      - {direction: egress, namespace: self, pod_label: app, pod_value: stego-fixture, port: 19093, protocol: TCP}
  browser-telemetry:
    service_name: hypershell-web-console
  typescript-sdk:
    error_codes: [service_account_name_exists]
    document: contracts/reference/openapi/openapi.yaml
    references:
      - contracts/reference/openapi/openapi.gatewayNetworks.yaml
      - contracts/reference/openapi/openapi.gatewayReleases.yaml
      - contracts/reference/openapi/openapi.gateways.yaml
      - contracts/reference/openapi/openapi.managedClusters.yaml
      - contracts/reference/openapi/openapi.managedDatabases.yaml
      - contracts/reference/openapi/openapi.roleBindings.yaml
      - contracts/reference/openapi/openapi.roles.yaml
      - contracts/reference/openapi/openapi.serviceAccounts.yaml
  go-sdk:
    document: contracts/reference/openapi/openapi.yaml
    references:
      - contracts/reference/openapi/openapi.gatewayNetworks.yaml
      - contracts/reference/openapi/openapi.gatewayReleases.yaml
      - contracts/reference/openapi/openapi.gateways.yaml
      - contracts/reference/openapi/openapi.managedClusters.yaml
      - contracts/reference/openapi/openapi.managedDatabases.yaml
      - contracts/reference/openapi/openapi.roleBindings.yaml
      - contracts/reference/openapi/openapi.roles.yaml
      - contracts/reference/openapi/openapi.serviceAccounts.yaml
  health-check:
    database: true
  postgres-adapter:
    migrations: external
  jwt-auth:
    roles_claim: realm_access.roles
    mode: verifier
  cli-application:
    factory_package: internal/cli
  http-application:
    factory_package: internal/httpapi
  grpc-application:
    processes:
      - {name: provisioner, factory_package: internal/serviceaccountprovisioner}
    watch_events: true
    factory_package: internal/grpcapi
    proto_files:
      - path: contracts/reference/proto/hypershell/v1/common.proto
        import_path: hypershell/v1/common.proto
      - path: contracts/reference/proto/hypershell/v1/gateways.proto
        import_path: hypershell/v1/gateways.proto
      - path: contracts/reference/proto/hypershell/provisioner/v1/service_accounts.proto
        import_path: hypershell/provisioner/v1/service_accounts.proto
      - path: contracts/reference/proto/hypershell/v1/role_bindings.proto
        import_path: hypershell/v1/role_bindings.proto
      - path: contracts/controlplane/gateway_identity.proto
        import_path: hypershell/controlplane/v1/gateway_identity.proto
      - path: contracts/controlplane/database_cleanup.proto
        import_path: hypershell/controlplane/v1/database_cleanup.proto
      - path: contracts/reference/proto/hypershell/v1/managed_clusters.proto
        import_path: hypershell/v1/managed_clusters.proto
      - path: contracts/reference/proto/hypershell/v1/gateway_releases.proto
        import_path: hypershell/v1/gateway_releases.proto
      - path: contracts/reference/proto/hypershell/v1/managed_databases.proto
        import_path: hypershell/v1/managed_databases.proto
      - path: contracts/reference/proto/hypershell/v1/gateway_networks.proto
        import_path: hypershell/v1/gateway_networks.proto
