kind: service
name: hypershell
archetype: service-core
language: go
base_path: /api/hypershell/v1

entities:
  - name: User
    fields:
      - { name: username, type: string, unique: true, min_length: 1, max_length: 255 }
      - { name: email, type: string, max_length: 320 }
      - { name: name, type: string, max_length: 255 }
  - name: Role
    fields:
      - { name: name, type: string, unique: true, max_length: 64 }
  - name: ManagedCluster
    fields:
      - { name: name, type: string, max_length: 255 }
  - name: GatewayRelease
    fields:
      - { name: name, type: string, max_length: 255 }
  - name: ManagedDatabase
    fields:
      - { name: name, type: string, max_length: 255 }
  - name: Gateway
    fields:
      - { name: name, type: string, min_length: 1, max_length: 255 }
      - { name: cluster_id, type: ref, to: ManagedCluster }
      - { name: release_id, type: ref, to: GatewayRelease }
      - { name: database_id, type: ref, to: ManagedDatabase }
      - { name: namespace, type: string, unique: true, max_length: 26 }
      - { name: external_dns, type: string, optional: true }
      - { name: tls_mode, type: string, optional: true }
      - { name: service_type, type: string, optional: true }
      - { name: status, type: string, optional: true }
      - { name: phase, type: string, optional: true }
      - { name: image, type: string, optional: true }
      - { name: supervisor_image, type: string, optional: true }
      - { name: server_dns_names, type: jsonb, optional: true }
      - { name: route_address, type: string, optional: true }
      - { name: console_address, type: string, optional: true }
      - { name: oidc, type: string, optional: true }
      - { name: route, type: string, optional: true }
      - { name: credential_driver, type: string, optional: true }
      - { name: active_sandbox_count, type: int32, optional: true }
  - name: RoleBinding
    fields:
      - { name: user_id, type: ref, to: User, unique_composite: [user_id, role_id, gateway_id] }
      - { name: role_id, type: ref, to: Role, unique_composite: [user_id, role_id, gateway_id] }
      - { name: gateway_id, type: ref, to: Gateway, unique_composite: [user_id, role_id, gateway_id] }
      - { name: scope, type: enum, values: [gateway] }

  - name: ServiceAccount
    fields:
      - { name: gateway_id, type: ref, to: Gateway, unique_composite: [gateway_id, active_name] }
      - { name: active_name, type: string, optional: true, unique_composite: [gateway_id, active_name], max_length: 128 }
      - { name: name, type: string, min_length: 1, max_length: 128 }
      - { name: description, type: string, optional: true, max_length: 1024 }
      - { name: credential_type, type: enum, values: [client_secret] }
      - { name: role, type: enum, values: [openshell-user, openshell-admin] }
      - { name: status, type: enum, values: [provisioning, ready, degraded, expired, revoking, revoked, deleting, error] }
      - { name: created_by_user_id, type: ref, to: User }
      - { name: client_id, type: string, unique: true, max_length: 128 }
      - { name: client_uuid, type: string, max_length: 255 }
      - { name: subject, type: string, max_length: 255 }
      - { name: expires_at, type: timestamp }
      - { name: revoked_at, type: timestamp, optional: true }
      - { name: last_error, type: string, optional: true, max_length: 64 }
      - { name: active, type: bool }
  - name: ServiceAccountAudit
    fields:
      - { name: service_account_id, type: ref, to: ServiceAccount }
      - { name: gateway_id, type: ref, to: Gateway }
      - { name: actor_user_id, type: string, max_length: 64 }
      - { name: creator_user_id, type: ref, to: User }
      - { name: action, type: string, max_length: 32 }
      - { name: outcome, type: string, max_length: 32 }
      - { name: role, type: string, max_length: 32 }
      - { name: expires_at, type: timestamp }

collections: {}
slots: []

overrides:
  postgres-adapter:
    migrations: external
  jwt-auth:
    roles_claim: realm_access.roles
    mode: verifier
  http-application:
    factory_package: internal/httpapi
  grpc-application:
    factory_package: internal/grpcapi
    proto_files:
      - path: contracts/reference/proto/hypershell/v1/common.proto
        import_path: hypershell/v1/common.proto
      - path: contracts/reference/proto/hypershell/v1/gateways.proto
        import_path: hypershell/v1/gateways.proto
      - path: contracts/reference/proto/hypershell/provisioner/v1/service_accounts.proto
        import_path: hypershell/provisioner/v1/service_accounts.proto
