kind: component
name: grpc-application
version: 1.11.0
output_namespace: grpcapi
config:
  processes:
    type: list
    items:
      name:
        type: string
      factory_package:
        type: string
  watch_events:
    type: bool
  factory_package:
    type: string
  proto_files:
    type: list
    items:
      path:
        type: string
      import_path:
        type: string
requires:
  - storage-adapter
  - auth-provider
provides:
  - application-grpc
slots: []
