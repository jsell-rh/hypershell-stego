kind: component
name: kubernetes-service
version: 1.5.0
output_namespace: deploy
config:
  kubernetes_api: {type: bool, optional: true}
  kubernetes_permissions:
    type: list
    optional: true
    items:
      scope: {type: string, enum: [namespace, cluster]}
      api_group: {type: string}
      resources:
        type: list
        items: {type: string}
      verbs:
        type: list
        items: {type: string, enum: [get, list, watch, create, update, patch, delete]}
      resource_names:
        type: list
        optional: true
        items: {type: string}
  source_directories:
    type: list
    items: {type: string}
  env_secret: {type: string}
  files_secret: {type: string}
  dns_namespace: {type: string}
  dns_port: {type: int}
  external_endpoints:
    type: list
    items: {type: string}
  network_peers:
    type: list
    items:
      direction: {type: string, enum: [ingress, egress]}
      namespace: {type: string}
      pod_label: {type: string}
      pod_value: {type: string}
      port: {type: int}
      protocol: {type: string, enum: [TCP, UDP]}
  workers:
    type: list
    items:
      name: {type: string}
      package: {type: string}
      function: {type: string}
      kubernetes_api: {type: bool, optional: true}
      kubernetes_permissions:
        type: list
        optional: true
        items:
          scope: {type: string, enum: [namespace, cluster]}
          api_group: {type: string}
          resources:
            type: list
            items: {type: string}
          verbs:
            type: list
            items: {type: string, enum: [get, list, watch, create, update, patch, delete]}
          resource_names:
            type: list
            optional: true
            items: {type: string}
      env_secret: {type: string, optional: true}
      files_secret: {type: string, optional: true}
      external_endpoints:
        type: list
        optional: true
        items: {type: string}
      network_peers:
        type: list
        optional: true
        items:
          direction: {type: string, enum: [egress]}
          namespace: {type: string}
          pod_label: {type: string}
          pod_value: {type: string}
          port: {type: int}
          protocol: {type: string, enum: [TCP, UDP]}
  rpc_processes:
    type: list
    items:
      name: {type: string}
      component: {type: string, enum: [grpc-application, grpc-processes]}
      process: {type: string}
      kubernetes_api: {type: bool, optional: true}
      kubernetes_permissions:
        type: list
        optional: true
        items:
          scope: {type: string, enum: [namespace, cluster]}
          api_group: {type: string}
          resources:
            type: list
            items: {type: string}
          verbs:
            type: list
            items: {type: string, enum: [get, list, watch, create, update, patch, delete]}
          resource_names:
            type: list
            optional: true
            items: {type: string}
      env_secret: {type: string, optional: true}
      files_secret: {type: string, optional: true}
      external_endpoints:
        type: list
        optional: true
        items: {type: string}
      network_peers:
        type: list
        optional: true
        items:
          direction: {type: string, enum: [ingress, egress]}
          namespace: {type: string}
          pod_label: {type: string}
          pod_value: {type: string}
          port: {type: int}
          protocol: {type: string, enum: [TCP, UDP]}
requires:
  - health-endpoint
provides:
  - kubernetes-service-deployment
slots: []
