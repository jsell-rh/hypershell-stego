kind: component
name: kubernetes-service
version: 1.1.1
output_namespace: deploy
config:
  source_directories:
    type: list
    items: {type: string}
  env_secret: {type: string}
  files_secret: {type: string}
  dns_namespace: {type: string}
  dns_port: {type: int}
  network_peers:
    type: list
    items:
      direction: {type: string, enum: [ingress, egress]}
      namespace: {type: string}
      pod_label: {type: string}
      pod_value: {type: string}
      port: {type: int}
      protocol: {type: string, enum: [TCP, UDP]}
  workers:
    type: list
    items:
      name: {type: string}
      package: {type: string}
      function: {type: string}
      env_secret: {type: string, optional: true}
      files_secret: {type: string, optional: true}
      network_peers:
        type: list
        optional: true
        items:
          direction: {type: string, enum: [egress]}
          namespace: {type: string}
          pod_label: {type: string}
          pod_value: {type: string}
          port: {type: int}
          protocol: {type: string, enum: [TCP, UDP]}
requires:
  - health-endpoint
provides:
  - kubernetes-service-deployment
slots: []
