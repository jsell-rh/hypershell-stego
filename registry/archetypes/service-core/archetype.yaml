kind: archetype
name: service-core
language: go
version: 1.2.0
components:
  - postgres-adapter
  - outbox
  - kafka-producer
  - cli-application
  - http-application
  - grpc-application
  - go-sdk
  - typescript-sdk
  - controller
  - runtime-configuration
  - health-check
  - kubernetes-service
  - otel-tracing
  - postgres-client
  - kubernetes-client
  - kubernetes-workload
  - keycloak-provider
  - tsl-search
default_auth: jwt-auth
conventions:
  layout: flat
  error_handling: problem-details-rfc
  response_format: envelope
  logging: structured-json
  test_pattern: table-driven
  request_validation: openapi-schema
  cors: disabled
bindings:
  health-endpoint: health-check
  application-http: http-application
  durable-outbox: outbox
  storage-adapter: postgres-adapter
  auth-provider: jwt-auth
