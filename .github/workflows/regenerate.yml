name: Regenerate with the pinned compiler

on:
  workflow_dispatch:
    inputs:
      installation_inputs:
        description: Optional public browser installation inputs; render a policy plan instead of regeneration
        required: false
        default: ''
        type: string
      sandbox_network:
        description: Render the native Sandbox packet fixture; requires installation inputs
        required: false
        default: false
        type: boolean
  push:
    paths:
      - .stego/compiler-revision
      - .github/workflows/regenerate.yml

permissions:
  contents: read

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.installation_inputs != ''
    uses: ./.github/workflows/browser-policy-plan.yml
    with:
      installation_inputs: ${{ inputs.installation_inputs }}
      sandbox_network: ${{ inputs.sandbox_network }}

  generate:
    if: github.event_name != 'workflow_dispatch' || inputs.installation_inputs == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - name: Require installation inputs for native packet probes
        if: github.event_name == 'workflow_dispatch' && inputs.sandbox_network
        run: |
          echo 'Native packet probes require installation inputs.' >&2
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: |
            go.sum
            console/go.sum
            gateway-console/go.sum
      - name: Verify the compiler and regenerate all modules
        env:
          GH_TOKEN: ${{ github.token }}
          STEGO_GENERATION_ROOT: ${{ runner.temp }}/generation
        run: scripts/generate.sh
      - name: Save generated files for review
        run: |
          mkdir -p "$RUNNER_TEMP/regenerated"
          git rev-parse HEAD > "$RUNNER_TEMP/regenerated/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/regenerated/source-archive.sha256"
          cp .stego/compiler-revision .stego/compiler-sha256 "$RUNNER_TEMP/regenerated/"
          # Include new generated files in the review patch.
          git add --intent-to-add -- out console/out gateway-console/out
          git diff --binary > "$RUNNER_TEMP/regenerated/generation.patch"
          tar -cf "$RUNNER_TEMP/regenerated/generated.tar" \
            out .stego/state.yaml go.mod go.sum \
            console/out console/.stego/state.yaml console/go.mod console/go.sum \
            gateway-console/out gateway-console/.stego/state.yaml gateway-console/go.mod gateway-console/go.sum
          sha256sum "$RUNNER_TEMP/regenerated/generated.tar" > "$RUNNER_TEMP/regenerated/generated.sha256"
      - name: Retain generation and compiler verification records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/regenerated
            ${{ runner.temp }}/generation/**/compiler-version.json
            ${{ runner.temp }}/generation/**/generation.log
            ${{ runner.temp }}/generation/**/compiler-setup/installation.json
          retention-days: 14
          if-no-files-found: error
