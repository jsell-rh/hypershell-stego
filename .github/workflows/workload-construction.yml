name: Gateway workload construction checks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/workload-construction.yml'
      - 'internal/gatewayworkload/resources*.go'
      - 'internal/gatewayworkload/public_tls*.go'
      - 'internal/gatewayworkload/kubernetes.go'
      - 'out/workload/**'

permissions:
  contents: read

concurrency:
  group: workload-construction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check Gateway declarations and verified dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workload-construction"
          git rev-parse HEAD > "$RUNNER_TEMP/workload-construction/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/workload-construction/source-archive.sha256"
          cp .stego/compiler-revision "$RUNNER_TEMP/workload-construction/compiler-revision"
          go test -json -race -count=1 -mod=readonly -timeout=3m ./internal/gatewayworkload \
            -run '^(TestGatewayWorkload.*|TestPublicTrustRequiresCertificateOnlyFile|TestPublicTLSConfigurationKeepsInternalNames|TestPublicTLSSecretCannotSupplyItsOwnTrust)$' \
            | tee "$RUNNER_TEMP/workload-construction/tests.jsonl"
          python3 - "$RUNNER_TEMP/workload-construction/tests.jsonl" <<'PYCHECK'
          import json, sys
          from pathlib import Path
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          required = {
              'TestGatewayWorkloadPreservesRuntimeContract',
              'TestGatewayWorkloadDigestTracksVerifiedDependencies',
              'TestGatewayWorkloadRejectsInvalidDependenciesWithoutResources',
              'TestPublicTrustRequiresCertificateOnlyFile',
              'TestPublicTLSConfigurationKeepsInternalNames',
              'TestPublicTLSSecretCannotSupplyItsOwnTrust',
          }
          assert not any(e['Action'] in {'fail', 'skip'} for e in events)
          started = [e['Test'] for e in events if e['Action'] == 'run' and e.get('Test')]
          passed = [e['Test'] for e in events if e['Action'] == 'pass' and e.get('Test')]
          assert len(started) == len(set(started)) and sorted(started) == sorted(passed)
          assert {name for name in passed if '/' not in name} == required
          PYCHECK
          git diff --exit-code
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workload-construction-${{ github.sha }}
          path: ${{ runner.temp }}/workload-construction/
          if-no-files-found: error
          retention-days: 14
