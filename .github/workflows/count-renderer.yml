name: Count fixture rendering

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/count-renderer.yml'
      - 'scripts/check-count-namespaces.py'
      - 'scripts/check-count-renderer.py'
      - 'out/deploy/**'

permissions:
  contents: read

concurrency:
  group: count-renderer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1024MiB
      GOFLAGS: -p=2 -mod=readonly
      GOWORK: 'off'
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check all count worker render inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/count-setup"
          git rev-parse HEAD > "$RUNNER_TEMP/count-setup/source-commit"
          go build -trimpath -o "$RUNNER_TEMP/count-setup/render" ./out/deploy/render
          python3 -B scripts/check-count-renderer.py \
            --render "$RUNNER_TEMP/count-setup/render" \
            --results "$RUNNER_TEMP/count-setup/records"
          git diff --exit-code
          rm "$RUNNER_TEMP/count-setup/render"
      - name: Retain render results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: count-renderer-${{ github.sha }}
          path: ${{ runner.temp }}/count-setup/
          if-no-files-found: error
          retention-days: 14
