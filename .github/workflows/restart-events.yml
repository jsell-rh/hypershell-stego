name: Event recovery after restart

on:
  workflow_dispatch:
  push:
    paths:
      - acceptance/gateway_observation_deadline_test.go
      - acceptance/runtime_test.go
      - .github/workflows/restart-events.yml

permissions:
  contents: read

concurrency:
  group: restart-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
      STEGO_REQUIRE_POSTGRES: '1'
      STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK: '1'
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: stego_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --cpus=1 --memory=512m --pids-limit=256
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Enable test database TLS
        timeout-minutes: 2
        run: scripts/enable-test-postgres-tls.sh "$POSTGRES_CONTAINER" "$RUNNER_TEMP/postgres-tls"
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Check recovery with the generated lease
        env:
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restart-events"
          git rev-parse HEAD > "$RUNNER_TEMP/restart-events/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/restart-events/source-archive.sha256"
          cp .stego/compiler-revision "$RUNNER_TEMP/restart-events/compiler-revision"
          go mod download github.com/jsell-rh/hypershell-stego/gateway-console
          go list -m -json github.com/jsell-rh/hypershell-stego/gateway-console > "$RUNNER_TEMP/restart-events/selected-gateway-console.json"
          python3 scripts/check-gateway-console-inputs.py "$RUNNER_TEMP/restart-events/selected-gateway-console.json"
          go test -json -race -count=1 -mod=readonly -timeout=5m ./acceptance \
            -run '^(TestGeneratedRuntimeRecoversUnfinishedClaim|TestGatewayProviderDeadlineCommitsFailureAndRecovers|TestGatewayCleanupDeadlineReopensConfirmation|TestGatewaySQLCleanupDeadlineKeepsStateUntilRecovery|TestIdentityCleanupDeadlineReopensConfirmation)$' \
            | tee "$RUNNER_TEMP/restart-events/tests.jsonl"
          python3 - "$RUNNER_TEMP/restart-events/tests.jsonl" <<'PYCHECK'
          import json, sys
          from pathlib import Path
          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          required = {
              'TestGeneratedRuntimeRecoversUnfinishedClaim',
              'TestGatewayProviderDeadlineCommitsFailureAndRecovers',
              'TestGatewayCleanupDeadlineReopensConfirmation',
              'TestGatewaySQLCleanupDeadlineKeepsStateUntilRecovery',
              'TestIdentityCleanupDeadlineReopensConfirmation',
          }
          assert not any(e['Action'] in {'fail', 'skip'} for e in events)
          started = [e['Test'] for e in events if e['Action'] == 'run']
          passed = [e['Test'] for e in events if e['Action'] == 'pass' and e.get('Test')]
          assert len(started) == len(required) and set(started) == required
          assert sorted(started) == sorted(passed)
          PYCHECK
          git diff --exit-code
      - name: Retain event recovery results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: restart-events-${{ github.sha }}
          path: ${{ runner.temp }}/restart-events/
          retention-days: 14
          if-no-files-found: error
