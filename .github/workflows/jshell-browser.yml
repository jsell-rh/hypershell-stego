name: Gateway browser workflow on jshell

on:
  workflow_dispatch:
    inputs:
      fixture_revision:
        description: Full commit ID of the checked browser inspection fixture
        type: string
        required: true
      image_run:
        description: Successful common image workflow run for this exact fixture
        type: string
        required: true
      image_attempt:
        description: Selected image workflow attempt
        type: string
        default: '1'
      image_policy:
        description: Independent common signature policy for the selected fixture
        type: string
        required: true
      registry_policy:
        description: Operator-approved registry token and blob origins
        type: string
        default: '{"format":1,"token_origins":[],"blob_origins":[]}'
      public_gateway:
        description: Test the public Gateway with the operator configuration
        type: boolean
        default: true
      sandbox_network:
        description: Run fixed native Sandbox packet probes under an operator-held lease
        type: boolean
        default: false
      held_lease_holder:
        description: Operator-held lease identity for a temporary test installation
        type: string
        default: ''
      held_lease_uid:
        description: Operator-held lease UID for a temporary test installation
        type: string
        default: ''
  # A live run needs a checked fixture commit and its signed image run.
  # Source and image workflows run first. The operator then selects both.

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: jshell-live-tests
  queue: max
  cancel-in-progress: false

jobs:
  gateway-workload:
    environment: jshell-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check the operator lease inputs
        env:
          NATIVE: ${{ inputs.sandbox_network }}
          HOLDER: ${{ inputs.held_lease_holder }}
          LEASE_UID: ${{ inputs.held_lease_uid }}
        run: |
          if [[ $NATIVE == true || -n $HOLDER || -n $LEASE_UID ]]; then
            test -n "$HOLDER" && test -n "$LEASE_UID"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check the CI boundary
        run: |
          python3 scripts/test_browser_ci.py
          python3 -B scripts/test_browser_image_run.py
          python3 scripts/test_ci_credentials.py
          python3 scripts/test_service_startup.py
          python3 scripts/test_browser_cluster_installation.py
          python3 scripts/test_browser_installation_inventory.py
          python3 scripts/test_browser_inspection.py
          python3 scripts/test_public_gateway_fixture.py
          go test -p=1 -mod=readonly -count=1 -timeout=30s scripts/browser-allocation-cleanup.go scripts/browser-allocation-cleanup_test.go
      - name: Check the selected image run
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_REVISION: ${{ inputs.fixture_revision }}
          IMAGE_RUN: ${{ inputs.image_run }}
          IMAGE_ATTEMPT: ${{ inputs.image_attempt }}
          IMAGE_POLICY: ${{ inputs.image_policy }}
          REGISTRY_POLICY: ${{ inputs.registry_policy }}
        run: python3 -B scripts/select-browser-image-run.py
      - name: Fetch the exact frozen inspection source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.fixture_revision }}
          path: browser-source
          persist-credentials: false
      - name: Check the frozen source and fetch its images
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_REVISION: ${{ inputs.fixture_revision }}
          IMAGE_RUN: ${{ inputs.image_run }}
          IMAGE_ATTEMPT: ${{ inputs.image_attempt }}
          SANDBOX_NETWORK: ${{ inputs.sandbox_network }}
        run: |
          test "$(git -C browser-source rev-parse HEAD)" = "$FIXTURE_REVISION"
          test -z "$(git -C browser-source status --porcelain --untracked-files=all)"
          test -s browser-source/acceptance/browser-inspection-source.json
          (cd browser-source && python3 -I -B - "$SANDBOX_NETWORK" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from sandbox_network_fixture import enabled
          if enabled(Path.cwd()) != (sys.argv[1] == 'true'):
              raise SystemExit('The selected fixture has a different network profile')
          PY
          )
          gh run download "$IMAGE_RUN" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/image-artifacts"
          # Run selection and signature policy both bind the exact attempt.
          python3 -B scripts/select-browser-image-run.py --recheck
      - name: Install the pinned OpenShift client
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/oc"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 120 \
            https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.22.12/openshift-client-linux-4.22.12.tar.gz \
            --output "$RUNNER_TEMP/oc/client.tar.gz"
          cd "$RUNNER_TEMP/oc"
          echo '0234aed5f4f13fbd0ff693c9eb8011bbfd97f1829296157c39810494b98cf84c  client.tar.gz' | sha256sum --check
          tar xf client.tar.gz oc
          echo "$RUNNER_TEMP/oc" >> "$GITHUB_PATH"
      - name: Write the internal Gateway trust
        env:
          INTERNAL_CA: ${{ vars.JSHELL_GATEWAY_INTERNAL_CA_PEM }}
        run: |
          test -n "$INTERNAL_CA"
          umask 077
          printf '%s' "$INTERNAL_CA" > "$RUNNER_TEMP/gateway-internal-ca.pem"
          echo "STEGO_TEST_GATEWAY_INTERNAL_CA_FILE=$RUNNER_TEMP/gateway-internal-ca.pem" >> "$GITHUB_ENV"
      - name: Write the private CI credential
        env:
          CI_KUBECONFIG: ${{ secrets.JSHELL_CI_KUBECONFIG }}
        run: |
          test -n "$CI_KUBECONFIG"
          umask 077
          printf '%s' "$CI_KUBECONFIG" > "$RUNNER_TEMP/jshell.kubeconfig"
      - name: Write the public test configuration
        if: inputs.public_gateway
        env:
          PUBLIC_CONFIG: ${{ vars.JSHELL_GATEWAY_PUBLIC_CONFIG }}
        run: |
          test -n "$PUBLIC_CONFIG"
          umask 077
          printf '%s' "$PUBLIC_CONFIG" > "$RUNNER_TEMP/public-gateway.json"
          echo "STEGO_TEST_GATEWAY_PUBLIC_CONFIG=$RUNNER_TEMP/public-gateway.json" >> "$GITHUB_ENV"
          echo 'STEGO_TEST_REQUIRE_PUBLIC_GATEWAY=1' >> "$GITHUB_ENV"
      - name: Run the generated Gateway workflow
        env:
          GH_TOKEN: ${{ github.token }}
          KUBECONFIG: ${{ runner.temp }}/jshell.kubeconfig
          STEGO_TEST_CONTEXT: jshell-ci
          STEGO_TEST_PREINSTALLED: '1'
          STEGO_TEST_BROWSER_DEPLOYMENT: '1'
          STEGO_TEST_BROWSER_WORKLOAD: '1'
          STEGO_TEST_GATEWAY_CLUSTER_ISSUER: acp-hypershell-test-ca
          STEGO_TEST_RESULTS: ${{ runner.temp }}/gateway-browser
          STEGO_TEST_HELD_LEASE_HOLDER: ${{ inputs.held_lease_holder }}
          STEGO_TEST_HELD_LEASE_UID: ${{ inputs.held_lease_uid }}
        run: bash "$GITHUB_WORKSPACE/browser-source/scripts/check-service-deployment.sh"
      - name: Remove local credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/jshell.kubeconfig" "$RUNNER_TEMP/gateway-browser/ci-token" "$RUNNER_TEMP/gateway-browser/private-job.json" "$RUNNER_TEMP/gateway-browser/server.key" "$RUNNER_TEMP/gateway-browser/ca.key"
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/gateway-browser/cleanup.json
            ${{ runner.temp }}/gateway-browser/compiler-transfer.json
            ${{ runner.temp }}/gateway-browser/compiler-setup/installation.json
            ${{ runner.temp }}/gateway-browser/compiler-setup/verified/*.json
            ${{ runner.temp }}/gateway-browser/compiler-setup/verified/*.jsonl
            ${{ runner.temp }}/gateway-browser/compiler-setup/verified/SHA256SUMS
            ${{ runner.temp }}/gateway-browser/allocation-*.json
            ${{ runner.temp }}/gateway-browser/installation.json
            ${{ runner.temp }}/gateway-browser/cluster-installation.json
            ${{ runner.temp }}/gateway-browser/cluster-manifests/*.json
            ${{ runner.temp }}/gateway-browser/job.json
            ${{ runner.temp }}/gateway-browser/job-status.json
            ${{ runner.temp }}/gateway-browser/ci-access.json
            ${{ runner.temp }}/gateway-browser/installation-inspection/*.json
            ${{ runner.temp }}/gateway-browser/installation-inspection/cluster-manifests/*.json
            ${{ runner.temp }}/gateway-browser/*.log
            ${{ runner.temp }}/gateway-browser/application.sha256
            ${{ runner.temp }}/gateway-browser/evidence.tar
            ${{ github.workspace }}/browser-source/acceptance/browser-inspection-source.json
            ${{ runner.temp }}/image-run-selection.json
            ${{ runner.temp }}/image-policy.json
            ${{ runner.temp }}/registry-policy.json
            ${{ runner.temp }}/gateway-browser/image-selection.json
            ${{ runner.temp }}/gateway-browser/image-compiler-installation.json
            ${{ runner.temp }}/gateway-browser/image-delivery-transfer.json
            ${{ runner.temp }}/gateway-browser/image-delivery.sha256
