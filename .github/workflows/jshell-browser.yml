name: Gateway browser workflow on jshell

on:
  workflow_dispatch:
    inputs:
      public_gateway:
        description: Test the public Gateway with the operator configuration
        type: boolean
        default: true
  push:

permissions:
  contents: read

concurrency:
  group: jshell-live-tests
  queue: max
  cancel-in-progress: false

jobs:
  gateway-workload:
    environment: jshell-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check the CI boundary
        run: |
          python3 scripts/test_browser_ci.py
          python3 scripts/test_ci_credentials.py
          python3 scripts/test_service_startup.py
          python3 scripts/test_browser_cluster_installation.py
          python3 scripts/test_browser_inspection.py
          python3 scripts/test_public_gateway_fixture.py
          go test -p=1 -mod=readonly -count=1 -timeout=30s scripts/browser-allocation-cleanup.go scripts/browser-allocation-cleanup_test.go
      - name: Prepare the frozen inspection source
        timeout-minutes: 5
        run: |
          revision=$(cat .stego/compiler-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          git init -q "$RUNNER_TEMP/compiler"
          git -C "$RUNNER_TEMP/compiler" remote add origin https://github.com/jsell-rh/stego.git
          git -C "$RUNNER_TEMP/compiler" fetch -q --depth=1 origin "$revision"
          git -C "$RUNNER_TEMP/compiler" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/compiler" rev-parse HEAD)" = "$revision"
          (cd "$RUNNER_TEMP/compiler"; GOWORK=off go build -mod=readonly -trimpath -buildvcs=true -o "$RUNNER_TEMP/stego" ./cmd/stego)
          python3 scripts/prepare-browser-inspection.py --compiler "$RUNNER_TEMP/stego" --destination "$RUNNER_TEMP/browser-source"
      - name: Install the pinned OpenShift client
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/oc"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 120 \
            https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.22.12/openshift-client-linux-4.22.12.tar.gz \
            --output "$RUNNER_TEMP/oc/client.tar.gz"
          cd "$RUNNER_TEMP/oc"
          echo '0234aed5f4f13fbd0ff693c9eb8011bbfd97f1829296157c39810494b98cf84c  client.tar.gz' | sha256sum --check
          tar xf client.tar.gz oc
          echo "$RUNNER_TEMP/oc" >> "$GITHUB_PATH"
      - name: Write the internal Gateway trust
        env:
          INTERNAL_CA: ${{ vars.JSHELL_GATEWAY_INTERNAL_CA_PEM }}
        run: |
          test -n "$INTERNAL_CA"
          umask 077
          printf '%s' "$INTERNAL_CA" > "$RUNNER_TEMP/gateway-internal-ca.pem"
          echo "STEGO_TEST_GATEWAY_INTERNAL_CA_FILE=$RUNNER_TEMP/gateway-internal-ca.pem" >> "$GITHUB_ENV"
      - name: Write the private CI credential
        env:
          CI_KUBECONFIG: ${{ secrets.JSHELL_CI_KUBECONFIG }}
        run: |
          test -n "$CI_KUBECONFIG"
          umask 077
          printf '%s' "$CI_KUBECONFIG" > "$RUNNER_TEMP/jshell.kubeconfig"
      - name: Write the public test configuration
        if: github.event_name == 'push' || inputs.public_gateway
        env:
          PUBLIC_CONFIG: ${{ vars.JSHELL_GATEWAY_PUBLIC_CONFIG }}
        run: |
          test -n "$PUBLIC_CONFIG"
          umask 077
          printf '%s' "$PUBLIC_CONFIG" > "$RUNNER_TEMP/public-gateway.json"
          echo "STEGO_TEST_GATEWAY_PUBLIC_CONFIG=$RUNNER_TEMP/public-gateway.json" >> "$GITHUB_ENV"
          echo 'STEGO_TEST_REQUIRE_PUBLIC_GATEWAY=1' >> "$GITHUB_ENV"
      - name: Run the generated Gateway workflow
        env:
          KUBECONFIG: ${{ runner.temp }}/jshell.kubeconfig
          STEGO_TEST_CONTEXT: jshell-ci
          STEGO_TEST_PREINSTALLED: '1'
          STEGO_TEST_BROWSER_DEPLOYMENT: '1'
          STEGO_TEST_BROWSER_WORKLOAD: '1'
          STEGO_TEST_GATEWAY_CLUSTER_ISSUER: acp-hypershell-test-ca
          STEGO_TEST_RESULTS: ${{ runner.temp }}/gateway-browser
        run: bash "$RUNNER_TEMP/browser-source/scripts/check-service-deployment.sh"
      - name: Remove local credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/jshell.kubeconfig" "$RUNNER_TEMP/gateway-browser/ci-token" "$RUNNER_TEMP/gateway-browser/private-job.json" "$RUNNER_TEMP/gateway-browser/server.key" "$RUNNER_TEMP/gateway-browser/ca.key"
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/gateway-browser/cleanup.json
            ${{ runner.temp }}/gateway-browser/allocation-*.json
            ${{ runner.temp }}/gateway-browser/installation.json
            ${{ runner.temp }}/gateway-browser/cluster-installation.json
            ${{ runner.temp }}/gateway-browser/cluster-manifests/*.json
            ${{ runner.temp }}/gateway-browser/job.json
            ${{ runner.temp }}/gateway-browser/job-status.json
            ${{ runner.temp }}/gateway-browser/ci-access.json
            ${{ runner.temp }}/gateway-browser/*.log
            ${{ runner.temp }}/gateway-browser/application.sha256
            ${{ runner.temp }}/gateway-browser/evidence.tar
            ${{ runner.temp }}/browser-source/acceptance/browser-inspection-source.json
