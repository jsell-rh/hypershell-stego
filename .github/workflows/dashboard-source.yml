name: Upstream dashboard source checks

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dashboard-source.yml
      - components/gateway-dashboard/**

permissions:
  contents: read

concurrency:
  group: dashboard-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Gkrumbach07/openshell-dashboard
          ref: 07f1b13ebd9e1826afe943b831b092be8bf92498
          path: upstream-dashboard
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.1'
      - name: Record the exact upstream input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dashboard-source"
          test "$(git -C upstream-dashboard rev-parse HEAD)" = 07f1b13ebd9e1826afe943b831b092be8bf92498
          git rev-parse HEAD > "$RUNNER_TEMP/dashboard-source/application-commit"
          git -C upstream-dashboard rev-parse HEAD > "$RUNNER_TEMP/dashboard-source/upstream-commit"
          git -C upstream-dashboard archive HEAD > "$RUNNER_TEMP/dashboard-source/upstream-source.tar"
          sha256sum "$RUNNER_TEMP/dashboard-source/upstream-source.tar" > "$RUNNER_TEMP/dashboard-source/upstream-source.sha256"
          cp upstream-dashboard/frontend/package-lock.json "$RUNNER_TEMP/dashboard-source/package-lock.json"
          cp upstream-dashboard/backend/go.mod upstream-dashboard/backend/go.sum "$RUNNER_TEMP/dashboard-source/"
      - name: Apply the checked dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          cp components/gateway-dashboard/backend/go.mod components/gateway-dashboard/backend/go.sum upstream-dashboard/backend/
          cp components/gateway-dashboard/frontend/package.json components/gateway-dashboard/frontend/package-lock.json upstream-dashboard/frontend/
          cp components/gateway-dashboard/frontend/webpack.stego.cjs upstream-dashboard/frontend/
          cp components/gateway-dashboard/frontend/index.stego.html upstream-dashboard/frontend/public/
          git -C upstream-dashboard apply --index "$GITHUB_WORKSPACE/components/gateway-dashboard/router.patch"
          git -C upstream-dashboard add backend/go.mod backend/go.sum frontend/package.json frontend/package-lock.json frontend/webpack.stego.cjs frontend/public/index.stego.html
          git -C upstream-dashboard diff --cached --binary > "$RUNNER_TEMP/dashboard-source/build-overlay.patch"
          build_tree=$(git -C upstream-dashboard write-tree)
          printf '%s\n' "$build_tree" > "$RUNNER_TEMP/dashboard-source/build-tree"
          git -C upstream-dashboard archive "$build_tree" > "$RUNNER_TEMP/dashboard-source/build-source.tar"
          sha256sum "$RUNNER_TEMP/dashboard-source/build-source.tar" > "$RUNNER_TEMP/dashboard-source/build-source.sha256"
      - name: Check the upstream Go backend
        id: backend
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/backend
        run: |
          set -euo pipefail
          go mod verify 2>&1 | tee "$RUNNER_TEMP/dashboard-source/go-verify.log"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/dashboard-source/dashboard" ./cmd/server 2>&1 | tee "$RUNNER_TEMP/dashboard-source/go-build.log"
          go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./... 2>&1 | tee "$RUNNER_TEMP/dashboard-source/go-vulnerabilities.log"
          git diff --exit-code
      - name: Build the upstream UI with its locked dependencies
        id: frontend
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/dashboard-source/npm-install.log"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/dashboard-source/typecheck.log"
          ./node_modules/.bin/webpack --config webpack.stego.cjs 2>&1 | tee "$RUNNER_TEMP/dashboard-source/ui-build.log"
          cp public/favicon.svg dist/assets/favicon.svg
          git diff --exit-code
      - name: Check the upstream router behavior
        id: router
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/frontend
        run: |
          set -euo pipefail
          npm test -- --runInBand src/app/__tests__/AppRoutes.spec.tsx src/pages/__tests__/SandboxListPage.spec.tsx 2>&1 | tee "$RUNNER_TEMP/dashboard-source/router-tests.log"
      - name: Check runtime JavaScript dependencies
        id: dependencies
        if: always() && steps.frontend.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/frontend
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low --json > "$RUNNER_TEMP/dashboard-source/npm-audit.json"
      - name: Check the real assets against the STEGO bundle contract
        id: assets
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          find upstream-dashboard/frontend/dist -type f -printf '%P %s\n' | sort > "$RUNNER_TEMP/dashboard-source/assets.txt"
          revision=$(cat .stego/compiler-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          go run "github.com/jsell-rh/stego/cmd/stego@$revision" assets \
            --directory upstream-dashboard/frontend/dist \
            --output "$RUNNER_TEMP/dashboard-source/build.zip" 2>&1 | tee "$RUNNER_TEMP/dashboard-source/asset-contract.log"
      - name: Require all source checks
        if: always()
        env:
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          ROUTER: ${{ steps.router.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          outcomes = {name.lower(): os.environ[name] for name in ("BACKEND", "FRONTEND", "ROUTER", "DEPENDENCIES", "ASSETS")}
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dashboard-source"
          target.mkdir(exist_ok=True)
          (target / "outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
          if any(value != "success" for value in outcomes.values()):
              raise SystemExit("Upstream dashboard source checks did not all pass")
          PY
      - name: Save source and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-source
          if-no-files-found: error
          retention-days: 7
