name: Upstream dashboard source checks

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dashboard-source.yml
      - components/gateway-dashboard/**

permissions:
  contents: read

concurrency:
  group: dashboard-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Gkrumbach07/openshell-dashboard
          ref: 07f1b13ebd9e1826afe943b831b092be8bf92498
          path: upstream-dashboard
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.1'
      - name: Record the exact upstream input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dashboard-source"
          test "$(git -C upstream-dashboard rev-parse HEAD)" = 07f1b13ebd9e1826afe943b831b092be8bf92498
          git rev-parse HEAD > "$RUNNER_TEMP/dashboard-source/application-commit"
          git -C upstream-dashboard rev-parse HEAD > "$RUNNER_TEMP/dashboard-source/upstream-commit"
          git -C upstream-dashboard archive HEAD > "$RUNNER_TEMP/dashboard-source/upstream-source.tar"
          sha256sum "$RUNNER_TEMP/dashboard-source/upstream-source.tar" > "$RUNNER_TEMP/dashboard-source/upstream-source.sha256"
          cp upstream-dashboard/frontend/package-lock.json "$RUNNER_TEMP/dashboard-source/package-lock.json"
          cp upstream-dashboard/backend/go.mod upstream-dashboard/backend/go.sum "$RUNNER_TEMP/dashboard-source/"
      - name: Apply the checked dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          cp components/gateway-dashboard/backend/go.mod components/gateway-dashboard/backend/go.sum upstream-dashboard/backend/
          cp components/gateway-dashboard/frontend/package.json components/gateway-dashboard/frontend/package-lock.json upstream-dashboard/frontend/
          cp components/gateway-dashboard/frontend/webpack.stego.cjs upstream-dashboard/frontend/
          cp components/gateway-dashboard/frontend/index.stego.html upstream-dashboard/frontend/public/
          git -C upstream-dashboard apply --index "$GITHUB_WORKSPACE/components/gateway-dashboard/router.patch"
          git -C upstream-dashboard add backend/go.mod backend/go.sum frontend/package.json frontend/package-lock.json frontend/webpack.stego.cjs frontend/public/index.stego.html
          git -C upstream-dashboard diff --cached --binary > "$RUNNER_TEMP/dashboard-source/build-overlay.patch"
          build_tree=$(git -C upstream-dashboard write-tree)
          printf '%s\n' "$build_tree" > "$RUNNER_TEMP/dashboard-source/build-tree"
          git -C upstream-dashboard archive "$build_tree" > "$RUNNER_TEMP/dashboard-source/build-source.tar"
          sha256sum "$RUNNER_TEMP/dashboard-source/build-source.tar" > "$RUNNER_TEMP/dashboard-source/build-source.sha256"
      - name: Check the upstream Go backend
        id: backend
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/backend
        run: |
          set -euo pipefail
          go mod verify 2>&1 | tee "$RUNNER_TEMP/dashboard-source/go-verify.log"
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/dashboard-source/dashboard" ./cmd/server 2>&1 | tee "$RUNNER_TEMP/dashboard-source/go-build.log"
          go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./... 2>&1 | tee "$RUNNER_TEMP/dashboard-source/go-vulnerabilities.log"
          git diff --exit-code
      - name: Build the upstream UI with its locked dependencies
        id: frontend
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/dashboard-source/npm-install.log"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/dashboard-source/typecheck.log"
          ./node_modules/.bin/webpack --config webpack.stego.cjs 2>&1 | tee "$RUNNER_TEMP/dashboard-source/ui-build.log"
          cp public/favicon.svg dist/assets/favicon.svg
          git diff --exit-code
      - name: Check the upstream router behavior
        id: router
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/frontend
        run: |
          set -euo pipefail
          npm test -- --runInBand src/app/__tests__/AppRoutes.spec.tsx src/pages/__tests__/SandboxListPage.spec.tsx 2>&1 | tee "$RUNNER_TEMP/dashboard-source/router-tests.log"
      - name: Check runtime JavaScript dependencies
        id: dependencies
        if: always() && steps.frontend.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        working-directory: upstream-dashboard/frontend
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low --json > "$RUNNER_TEMP/dashboard-source/npm-audit.json"
      - name: Check the real assets against the STEGO bundle contract
        id: assets
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          find upstream-dashboard/frontend/dist -type f -printf '%P %s\n' | sort > "$RUNNER_TEMP/dashboard-source/assets.txt"
          tar -C upstream-dashboard/frontend/dist -cf "$RUNNER_TEMP/dashboard-source/assets.tar" .
          revision=$(cat components/gateway-dashboard/compiler-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$revision" > "$RUNNER_TEMP/dashboard-source/compiler-revision"
          git init -q "$RUNNER_TEMP/dashboard-compiler"
          git -C "$RUNNER_TEMP/dashboard-compiler" remote add origin https://github.com/jsell-rh/stego.git
          git -C "$RUNNER_TEMP/dashboard-compiler" fetch -q --depth=1 origin "$revision"
          git -C "$RUNNER_TEMP/dashboard-compiler" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dashboard-compiler" rev-parse HEAD)" = "$revision"
          (cd "$RUNNER_TEMP/dashboard-compiler"; go build -mod=readonly -trimpath -buildvcs=true -o "$RUNNER_TEMP/dashboard-stego" ./cmd/stego)
          "$RUNNER_TEMP/dashboard-stego" assets \
            --directory upstream-dashboard/frontend/dist \
            --output "$RUNNER_TEMP/dashboard-source/build.zip" 2>&1 | tee "$RUNNER_TEMP/dashboard-source/asset-contract.log"
          "$RUNNER_TEMP/dashboard-stego" assets \
            --directory upstream-dashboard/frontend/dist \
            --output "$RUNNER_TEMP/dashboard-source/repeated.zip"
          cmp "$RUNNER_TEMP/dashboard-source/build.zip" "$RUNNER_TEMP/dashboard-source/repeated.zip"
          export STEGO_REGISTRY="$RUNNER_TEMP/dashboard-compiler/registry"
          mkdir -p "$RUNNER_TEMP/dashboard-build-check/ui"
          cd "$RUNNER_TEMP/dashboard-build-check"
          "$RUNNER_TEMP/dashboard-stego" init --archetype browser-service
          cp "$GITHUB_WORKSPACE/components/gateway-dashboard/generation-service.yaml" service.yaml
          cp "$RUNNER_TEMP/dashboard-source/build.zip" ui/build.zip
          printf 'module example.test/dashboard\n\ngo 1.26.8\n' > go.mod
          "$RUNNER_TEMP/dashboard-stego" apply 2>&1 | tee "$RUNNER_TEMP/dashboard-source/generation.log"
          "$RUNNER_TEMP/dashboard-stego" deps 2>&1 | tee -a "$RUNNER_TEMP/dashboard-source/generation.log"
          "$RUNNER_TEMP/dashboard-stego" apply 2>&1 | tee -a "$RUNNER_TEMP/dashboard-source/generation.log"
          cp .stego/state.yaml "$RUNNER_TEMP/dashboard-source/first-state.yaml"
          "$RUNNER_TEMP/dashboard-stego" apply 2>&1 | tee -a "$RUNNER_TEMP/dashboard-source/generation.log"
          cmp .stego/state.yaml "$RUNNER_TEMP/dashboard-source/first-state.yaml"
          "$RUNNER_TEMP/dashboard-stego" drift 2>&1 | tee -a "$RUNNER_TEMP/dashboard-source/generation.log"
          go build -mod=readonly -o "$RUNNER_TEMP/dashboard-source/generated-browser" ./out 2>&1 | tee "$RUNNER_TEMP/dashboard-source/generated-build.log"
          tar -cf "$RUNNER_TEMP/dashboard-source/generated-source.tar" service.yaml go.mod go.sum .stego out
      - name: Require all source checks
        if: always()
        env:
          BACKEND: ${{ steps.backend.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          ROUTER: ${{ steps.router.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          outcomes = {name.lower(): os.environ[name] for name in ("BACKEND", "FRONTEND", "ROUTER", "DEPENDENCIES", "ASSETS")}
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dashboard-source"
          target.mkdir(exist_ok=True)
          (target / "outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
          if any(value != "success" for value in outcomes.values()):
              raise SystemExit("Upstream dashboard source checks did not all pass")
          PY
      - name: Save source and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-source
          if-no-files-found: error
          retention-days: 7

  private-application:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check the deployment evidence verifier
        run: timeout 15s python3 scripts/test_dashboard_deployment.py
      - name: Read the successful source result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dashboard-private/source"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "dashboard-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --dir "$RUNNER_TEMP/dashboard-private/source"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dashboard-private/source"
          assert (root / "application-commit").read_text().strip() == os.environ["GITHUB_SHA"]
          outcomes = json.loads((root / "outcomes.json").read_text())
          assert set(outcomes) == {"backend", "frontend", "router", "dependencies", "assets"}
          assert all(value == "success" for value in outcomes.values())
          PY
      - name: Build the checked upstream image
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dashboard-private"
          mkdir -p "$root/image"
          cp "$root/source/dashboard" "$root/image/dashboard"
          cp components/gateway-dashboard/Containerfile "$root/image/Containerfile"
          image="ghcr.io/jsell-rh/hypershell-stego-dashboard-ci:$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          docker build --network=none --file "$root/image/Containerfile" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" "$root/image" 2>&1 | tee "$root/image-build.log"
          docker run --rm --network=none --read-only --user 65532:65532 \
            --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=32 \
            --memory=128m --cpus=0.5 "$image" --help > "$root/image-entry.log" 2>&1
          docker image inspect "$image" > "$root/image-inspect.json"
          docker save "$image" --output "$root/dashboard-image.tar"
          printf '%s\n' "$image" > "$root/image-tag"
      - name: Publish the candidate image by digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/dashboard-registry-auth"
          mkdir -m 700 -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          root="$RUNNER_TEMP/dashboard-private"
          image=$(cat "$root/image-tag")
          docker push "$image" 2>&1 | tee "$root/image-push.log"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > "$root/image-digests.json"
      - name: Generate the private browser and deployment for the real image
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dashboard-private"
          revision=$(cat components/gateway-dashboard/private-compiler-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          git init -q "$root/compiler"
          git -C "$root/compiler" remote add origin https://github.com/jsell-rh/stego.git
          git -C "$root/compiler" fetch -q --depth=1 origin "$revision"
          git -C "$root/compiler" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$root/compiler" rev-parse HEAD)" = "$revision"
          (cd "$root/compiler"; go build -mod=readonly -trimpath -buildvcs=true -o "$root/stego" ./cmd/stego)
          printf '%s\n' "$revision" > "$root/compiler-revision"
          export STEGO_REGISTRY="$root/compiler/registry"
          mkdir -p "$root/browser/ui"
          cd "$root/browser"
          "$root/stego" init --archetype browser-service
          cp "$root/source/build.zip" ui/build.zip
          cp "$GITHUB_WORKSPACE/components/gateway-dashboard/private-service.yaml" service.yaml
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dashboard-private"
          digests = json.loads((root / "image-digests.json").read_text())
          selected = [v for v in digests if re.fullmatch(r"ghcr\.io/jsell-rh/hypershell-stego-dashboard-ci@sha256:[0-9a-f]{64}", v)]
          assert len(selected) == 1
          service = pathlib.Path("service.yaml")
          text = service.read_text()
          assert text.count("IMAGE_FROM_CHECKED_BUILD") == 1
          service.write_text(text.replace("IMAGE_FROM_CHECKED_BUILD", selected[0]))
          (root / "application-image").write_text(selected[0] + "\n")
          PY
          printf 'module example.test/dashboard-private\n\ngo 1.26.8\n' > go.mod
          "$root/stego" apply 2>&1 | tee "$root/generation.log"
          "$root/stego" deps 2>&1 | tee -a "$root/generation.log"
          "$root/stego" apply 2>&1 | tee -a "$root/generation.log"
          cp .stego/state.yaml "$root/first-state.yaml"
          "$root/stego" apply 2>&1 | tee -a "$root/generation.log"
          cmp .stego/state.yaml "$root/first-state.yaml"
          "$root/stego" drift 2>&1 | tee -a "$root/generation.log"
          go build -mod=readonly -o "$root/generated-browser" ./out 2>&1 | tee "$root/generated-build.log"
          go build -mod=readonly -o "$root/render" ./out/deploy/render
          "$root/render" --namespace=dashboard-check \
            --image=registry.example.test/browser@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --fs-group=65532 > "$root/deployment.json"
          python3 "$GITHUB_WORKSPACE/scripts/check-dashboard-deployment.py" "$root"
          tar -cf "$root/generated-source.tar" service.yaml go.mod go.sum .stego out
      - name: Save private application evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dashboard-private/*.json
            ${{ runner.temp }}/dashboard-private/*.log
            ${{ runner.temp }}/dashboard-private/*.yaml
            ${{ runner.temp }}/dashboard-private/*.tar
            ${{ runner.temp }}/dashboard-private/application-image
            ${{ runner.temp }}/dashboard-private/compiler-revision
            ${{ runner.temp }}/dashboard-private/generated-browser
          if-no-files-found: error
          retention-days: 7
