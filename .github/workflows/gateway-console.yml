name: Generated Gateway console

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gateway-console.yml
      - gateway-console/**
      - scripts/generate-gateway-console.sh
      - scripts/generate.sh
      - scripts/prepare-compiler.sh
      - .stego/tooling-revision
      - .stego/compiler-revision
      - .stego/compiler-sha256
      - scripts/check-gateway-console-inputs.py
      - scripts/check-dashboard-deployment.py

permissions:
  contents: read

concurrency:
  group: gateway-console-${{ github.ref }}
  cancel-in-progress: false

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: gateway-console/go.sum
      - name: Check compiler selection
        run: timeout 15s python3 -B scripts/test_verified_generation.py
      - name: Verify exact inputs and committed generation
        env:
          GH_TOKEN: ${{ github.token }}
          STEGO_GENERATION_ROOT: ${{ runner.temp }}/gateway-console-generation
        run: scripts/generate-gateway-console.sh --check
      - name: Check dependencies and build both entry points
        working-directory: gateway-console
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-console"
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./... 2>&1 | tee "$RUNNER_TEMP/gateway-console/vulnerabilities.log"
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/gateway-console/browser" ./out
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/gateway-console/render" ./out/deploy/render
      - name: Check the real dashboard binding and private deployment
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gateway-console"
          "$root/render" --namespace=dashboard-check --fs-group=65532 \
            --image=registry.example.test/browser@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > "$root/deployment.json"
          "$root/render" --namespace=dashboard-check --fs-group=65532 \
            --image=registry.example.test/browser@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --image-pull-secret=dashboard-images > "$root/deployment-pull-secret.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'gateway-console'
          source = json.loads(Path('gateway-console/upstream.json').read_text())
          original = json.loads((root / 'deployment.json').read_text())
          private = json.loads((root / 'deployment-pull-secret.json').read_text())
          deployments = [item for item in private['items'] if item['kind'] == 'Deployment']
          if len(deployments) != 1:
              raise SystemExit('Expected one dashboard deployment')
          pod = deployments[0]['spec']['template']['spec']
          if pod.pop('imagePullSecrets', None) != [{'name': 'dashboard-images'}]:
              raise SystemExit('The dashboard image pull reference differs')
          if private != original:
              raise SystemExit('The pull reference changed other dashboard resources')
          (root / 'application-image').write_text(source['image'] + '\n')
          PY
          python3 scripts/check-dashboard-deployment.py "$root"
          git rev-parse HEAD > "$root/source-commit"
          cp gateway-console/.stego/compiler-revision "$root/compiler-revision"
          cp gateway-console/upstream.json "$root/upstream.json"
          tar -C gateway-console -cf "$root/generated-source.tar" service.yaml .stego/config.yaml .stego/compiler-revision .stego/state.yaml go.mod go.sum out
      - name: Publish and verify the generated browser image
        timeout-minutes: 8
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gateway-console"
          image="ghcr.io/jsell-rh/hypershell-stego-gateway-console-ci:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container="stego-console-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export DOCKER_CONFIG="$RUNNER_TEMP/console-image-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker rm "$container" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          docker build --file gateway-console/out/deploy/Containerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" gateway-console 2>&1 | tee "$root/browser-image-build.log"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '65532:65532'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image")" = '["/service"]'
          docker create --name "$container" --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=32 \
            --memory=128m --cpus=0.5 "$image" >/dev/null
          docker cp "$container:/service" "$root/image-service"
          cmp "$root/browser" "$root/image-service"
          sha256sum "$root/image-service" > "$root/browser-image-binary.sha256"
          rm "$root/image-service"
          docker rm "$container" >/dev/null
          docker image inspect "$image" > "$root/browser-image-inspect.json"
          built_id=$(docker image inspect --format '{{.Id}}' "$image")
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$image" 2>&1 | tee "$root/browser-image-push.log"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ $digest =~ ^ghcr\.io/jsell-rh/hypershell-stego-gateway-console-ci@sha256:[0-9a-f]{64}$ ]]
          docker pull "$digest" 2>&1 | tee "$root/browser-image-pull.log"
          test "$(docker image inspect --format '{{.Id}}' "$digest")" = "$built_id"
          printf '%s\n' "$digest" > "$root/browser-image"
          printf '{"binary_matches_module":true,"pulled_digest_matches_build":true}\n' > "$root/browser-image-verification.json"
      - name: Retain the generated application evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-console-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/gateway-console/*
            ${{ runner.temp }}/gateway-console-generation/*/generation.log
            ${{ runner.temp }}/gateway-console-generation/*/first-state.yaml
            ${{ runner.temp }}/gateway-console-generation/*/compiler-setup/installation.json
            ${{ runner.temp }}/gateway-console-generation/*/compiler-setup/*-revision
            ${{ runner.temp }}/gateway-console-generation/*/compiler-setup/verified/*.json
            ${{ runner.temp }}/gateway-console-generation/*/compiler-setup/verified/*.jsonl
            ${{ runner.temp }}/gateway-console-generation/*/compiler-setup/verified/SHA256SUMS
