name: Retained grant history costs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/retained-history.yml'
      - 'acceptance/retained_history_linux_test.go'
      - 'scripts/verify-retained-history.py'
      - 'scripts/test_retained_history.py'

permissions:
  contents: read

concurrency:
  group: retained-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
      GOWORK: 'off'
      CGO_ENABLED: '0'
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: stego_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --cpus=1 --memory=512m --pids-limit=256
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Check the result verifier
        run: python3 -B scripts/test_retained_history.py
      - name: Build the exact checked source
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/retained-history"
          go test -c -p=2 -mod=readonly -trimpath -buildvcs=true -o "$RUNNER_TEMP/retained-history/acceptance.test" ./acceptance
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/retained-history/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/retained-history/source-archive.sha256"
          cp .stego/compiler-revision "$RUNNER_TEMP/retained-history/compiler-revision"
          go version > "$RUNNER_TEMP/retained-history/toolchain.txt"
          sha256sum "$RUNNER_TEMP/retained-history/acceptance.test" > "$RUNNER_TEMP/retained-history/binary.sha256"
      - name: Measure complete scans in a bounded container
        timeout-minutes: 6
        env:
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -o pipefail
          docker create --name stego-retained-history --network=host \
            --cpus=1 --memory=768m --memory-swap=768m --pids-limit=128 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user=65532:65532 --tmpfs /tmp:rw,nosuid,nodev,size=67108864 \
            --mount "type=bind,source=$RUNNER_TEMP/retained-history/acceptance.test,target=/acceptance.test,readonly" \
            --env STEGO_TEST_POSTGRES_DSN --env STEGO_REQUIRE_POSTGRES=1 \
            --env STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK=1 \
            --env GOMAXPROCS=1 --env GOMEMLIMIT=512MiB \
            --entrypoint /acceptance.test \
            postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 \
            -test.run='^$' -test.bench='^BenchmarkRetainedGrantInventory$' \
            -test.benchtime=3x -test.count=3 -test.timeout=4m -test.cpu=1 -test.benchmem
          timeout --signal=TERM --kill-after=5s 5m docker start --attach stego-retained-history \
            | tee "$RUNNER_TEMP/retained-history/benchmark.txt"
          docker inspect --format '{{json .State}}' stego-retained-history > "$RUNNER_TEMP/retained-history/container-state.json"
          docker inspect --format '{{json .HostConfig}}' stego-retained-history > "$RUNNER_TEMP/retained-history/container-limits.json"
          python3 scripts/verify-retained-history.py "$RUNNER_TEMP/retained-history"
      - name: Save terminal state and remove the test container
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/retained-history"
          if docker container inspect stego-retained-history >/dev/null 2>&1; then
            docker inspect --format '{{json .State}}' stego-retained-history > "$RUNNER_TEMP/retained-history/cleanup-container-state.json"
            docker rm --force stego-retained-history
          fi
          test -z "$(docker ps -aq --filter name='^/stego-retained-history$')"
      - name: Save the source and measurement records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-history/
          if-no-files-found: error
          retention-days: 14
