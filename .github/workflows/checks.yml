name: Gateway and contract checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      # These records describe completed checks and are not runtime inputs.
      - 'acceptance/*-evidence*.json'
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Run all checks or the console check only
        type: choice
        default: all
        options: [all, console]

env:
  # CI uses the runner's loopback address for its database fixture.
  STEGO_DATABASE_ALLOW_INSECURE_LOOPBACK: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let active push checks finish. New pull requests can replace obsolete checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'console' }}
    name: acceptance (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'browser' && 15 || 35 }}
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 # 18.6-alpine
        env:
          POSTGRES_PASSWORD: stego_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - run: npm ci --prefix acceptance/typescript --install-links --ignore-scripts --no-audit --no-fund
      - run: node acceptance/typescript/node_modules/typescript/lib/tsc.js --strict --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext acceptance/browser_sdk_types.mts
      - name: Check the selected Gateway console source
        run: |
          go mod download github.com/jsell-rh/hypershell-stego/gateway-console
          go list -m -json github.com/jsell-rh/hypershell-stego/gateway-console > "$RUNNER_TEMP/gateway-console-module.json"
          python3 scripts/check-gateway-console-inputs.py "$RUNNER_TEMP/gateway-console-module.json"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
      - name: Check console dependencies
        working-directory: console
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
      - name: Enable test database TLS
        timeout-minutes: 2
        run: scripts/enable-test-postgres-tls.sh "$POSTGRES_CONTAINER" "$RUNNER_TEMP/postgres-tls"
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Start the bounded browser fixture
        if: matrix.suite == 'browser'
        timeout-minutes: 3
        run: |
          docker run --detach --name "stego-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --cpus=1 --memory=1536m --pids-limit=256 --network=host \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/sample-browser-resources.sh,target=/opt/stego-sample-browser-resources.sh,readonly" \
            --env XDG_CONFIG_HOME=/tmp/config --env XDG_CACHE_HOME=/tmp/cache \
            --entrypoint chromedriver \
            selenium/standalone-chromium@sha256:81c80050126f610675e40eeac529a821dc5a0d38acf26c6d44f792a6e7ea8ac5 \
            --port=9515 --allowed-ips=127.0.0.1
          docker exec --detach "stego-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            sh /opt/stego-sample-browser-resources.sh
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9515/status >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: scripts/check-gateway.sh --suite=${{ matrix.suite }}
        env:
          GH_TOKEN: ${{ github.token }}
          STEGO_REQUIRE_BROWSER: '1'
          STEGO_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/rendered-browser
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
      - name: Save browser resource counters
        if: always() && matrix.suite == 'browser'
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/rendered-browser"
          browser_container="stego-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            timeout 10s docker inspect --format '{"status":{{json .State.Status}},"oom_killed":{{json .State.OOMKilled}},"exit_code":{{.State.ExitCode}},"memory_limit":{{.HostConfig.Memory}},"pids_limit":{{.HostConfig.PidsLimit}}}' "$browser_container" || true
            timeout 10s docker stats --no-stream --format '{{json .}}' "$browser_container" || true
            timeout 10s docker exec "$browser_container" sh -c '
              for file in memory.events memory.peak memory.max pids.events pids.current pids.max; do
                if [ -r "/sys/fs/cgroup/$file" ]; then
                  printf "%s\n" "$file"
                  cat "/sys/fs/cgroup/$file"
                fi
              done
              df -k /tmp /dev/shm
              if [ -r /tmp/stego-browser-resource-peaks.txt ]; then
                cat /tmp/stego-browser-resource-peaks.txt
              else
                echo "Browser resource samples are missing"
              fi
            ' || true
          } > "$RUNNER_TEMP/rendered-browser/browser-resources.txt" 2>&1
      - name: Stop the browser fixture
        if: always() && matrix.suite == 'browser'
        run: docker rm --force "stego-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true
      - name: Save rendered browser evidence
        if: always() && matrix.suite == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-browser
          retention-days: 7
          path: |
            ${{ runner.temp }}/rendered-browser/*.png
            ${{ runner.temp }}/rendered-browser/*.txt
            ${{ runner.temp }}/rendered-browser/*.network.json
            ${{ runner.temp }}/rendered-browser/browser-startup-signals.json

  sandbox-workload:
    # Deferred by the user on 2026-09-15. No Kata test cluster is available.
    # Keep this gate visibly skipped until its restricted live runner is ready.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_PASSWORD: stego_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - run: scripts/generate.sh --check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: scripts/check-sandbox-workload.sh
        env:
          STEGO_TEST_POSTGRES_DSN: postgres://postgres:stego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable

  service-image:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'console' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: timeout 15s scripts/test-wait-service-result.sh
      - run: timeout 15s scripts/test-collect-service-evidence.sh
      - run: timeout 15s python3 scripts/test_ci_credentials.py
      - run: timeout 15s python3 -B scripts/test_verified_generation.py
      - run: timeout 15s python3 -B scripts/test_console_asset_compiler.py
      - run: timeout 15s python3 scripts/test_browser_ci.py
      - run: timeout 15s python3 scripts/test_network_peer_fixture.py
      - run: timeout 15s python3 scripts/test_gateway_endpoint_fixture.py
      - run: timeout 15s python3 scripts/test_gateway_endpoint_change.py
      - run: timeout 15s python3 scripts/test_browser_cluster_installation.py
      - run: timeout 15s python3 scripts/test_browser_installation_inventory.py
      - run: timeout 15s python3 scripts/test_browser_public_permissions.py
      - run: timeout 15s python3 scripts/test_browser_inspection.py
      - run: timeout 15s python3 scripts/test_cleanup_browser_ci.py
      - run: bash -n scripts/check-external-egress.sh
      - name: Build the generated service image
        run: docker build --file out/deploy/Containerfile --tag hypershell-stego:check .
      - name: Check the image entry point
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' hypershell-stego:check)" = '65532:65532'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' hypershell-stego:check)" = '["/service"]'
      - name: Build and check the generated console image
        run: |
          docker build --file console/out/deploy/Containerfile --tag hypershell-console:check console
          test "$(docker image inspect --format '{{.Config.User}}' hypershell-console:check)" = '65532:65532'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' hypershell-console:check)" = '["/service"]'
      - name: Build and check the generated RPC image
        run: |
          docker build --file out/deploy/rpc/provisioner/Containerfile --tag hypershell-provisioner:check .
          test "$(docker image inspect --format '{{.Config.User}}' hypershell-provisioner:check)" = '65532:65532'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' hypershell-provisioner:check)" = '["/rpc"]'
      - name: Build and check the generated worker images
        run: |
          for worker in namespace-allocation gateway-identity gateway-workload sandbox-count; do
            docker build --file "out/deploy/workers/$worker/Containerfile" --tag "hypershell-$worker:check" .
            test "$(docker image inspect --format '{{.Config.User}}' "hypershell-$worker:check")" = '65532:65532'
            test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "hypershell-$worker:check")" = '["/worker"]'
          done

  web-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.1'
      - name: Install the selected pnpm version
        run: |
          npm install --prefix "$RUNNER_TEMP/pnpm" --ignore-scripts --no-audit --no-fund pnpm@11.15.1
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: timeout 15s python3 -B scripts/test_check_phases.py
      - run: scripts/check-web-console.sh
        env:
          STEGO_CHECK_PHASE_ROOT: ${{ runner.temp }}/console-public-phases
          GH_TOKEN: ${{ github.token }}
      - name: Save public check phases
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-public-phases
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/console-public-phases/*.tsv
