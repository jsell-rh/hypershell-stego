name: CNPG fixture boundary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cnpg-fixture.yml'
      - 'scripts/ci_credentials.py'
      - 'scripts/cnpg_ci.py'
      - 'scripts/cnpg-installation-fixture.py'
      - 'scripts/test_cnpg_ci.py'
      - 'scripts/test_cnpg_installation_fixture.py'
      - 'acceptance/kubernetes-service-job.json'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check dependency lifetimes and CI authority
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cnpg-fixture"
          git rev-parse HEAD > "$RUNNER_TEMP/cnpg-fixture/source-commit"
          git archive HEAD | sha256sum > "$RUNNER_TEMP/cnpg-fixture/source-archive.sha256"
          for name in test_cnpg_ci test_cnpg_installation_fixture test_ci_credentials; do
            timeout 30s python3 -B "scripts/$name.py" -v 2>&1 | tee "$RUNNER_TEMP/cnpg-fixture/$name.log"
          done
          git diff --exit-code
      - name: Save boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cnpg-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cnpg-fixture
          retention-days: 14
          if-no-files-found: error
